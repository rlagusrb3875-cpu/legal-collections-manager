/* ═════════ 통계 (15차 시안) ═════════
   ① 집행권원 확보 채무자 중 세무서 미압류  — 02_법조치 「제3채무자유형」(예금 · 예금+세무서 · 세무서 · 보험+세무서 …)에 「세무서」가 한 번도 없는 사람
   ② 실효·폐지 대상 × 급여 압류추심        — 08_채무조정(개인회생·파산 폐지, 신용회복 실효) + 종합관리 회생·파산 관리 폐지결정
   ③ 입금유형별 통계 (월 · 연)              — 04_입금 입금구분 */
const med=a=>{if(!a.length)return null;const b=[...a].sort((x,y)=>x-y),m=b.length>>1;return b.length%2?b[m]:(b[m-1]+b[m])/2};
const SD=()=>DEBT.filter(d=>!ST.gpf||d.pf===ST.gpf);
function stackBars(rows,keys,colors,fmt){const tot=r=>keys.reduce((a,k)=>a+(r.v[k]||0),0),mx=Math.max(1,...rows.map(tot));
  return `<div class="sbar">${rows.map(r=>`<div class="sbc" title="${r.l} · ${fmt(tot(r))}"><em>${tot(r)?fmt(tot(r)):''}</em><div class="sbs" style="height:${tot(r)/mx*100}%">${keys.map(k=>r.v[k]?`<i style="flex:${r.v[k]} 1 0;background:${colors[k]}"></i>`:'').join('')}</div><span>${r.s}</span></div>`).join('')}</div>`}
const kpiRow=K=>`<div class="kpis" style="grid-template-columns:repeat(${K.length},minmax(0,1fr))">${K.map(k=>`<div class="card kpi"><span>${k[0]}</span><b class="${k[3]||''}">${k[1]}</b><em>${k[2]||''}</em></div>`).join('')}</div>`;
const segBtns=(cur,list,set)=>`<div class="seg">${list.map(([k,n])=>`<button class="${cur===k?'on':''}" onclick="${set}='${k}';render()">${n}</button>`).join('')}</div>`;

// ① 세무서 미압류
function taxRows(){if(ST._tax&&ST._tax.v===ST.gpf)return ST._tax.l;const out=[];
  for(const d of SD()){const tit=d.acts.filter(a=>a.conf!=null&&(a.g==='지급명령'||a.g==='소송'));if(!tit.length)continue;
    const sz=d.acts.filter(a=>a.g==='압류추심'),tax=sz.filter(a=>/세무서/.test(a.ttype||''));
    out.push({d,tax:tax.length>0,taxLast:tax.length?tax[tax.length-1]:null,title:tit.reduce((x,y)=>y.conf<x.conf?y:x),sz,last:sz[sz.length-1]||null,
      types:[...new Set(sz.map(a=>a.ttype||a.s).filter(Boolean))],sihyo:Math.min(...d.accts.map(a=>a.sihyo))})}
  ST._tax={v:ST.gpf,l:out};return out}
function expTax(){const F=ST.tf||{};const l=taxRows().filter(x=>!x.tax&&(!F.o||x.d.owner===F.o)&&x.d.bal>=(F.min||0)&&(!F.none||!x.sz.length)).sort((a,b)=>b.d.bal-a.d.bal);
  downloadCSV(`세무서 미압류_${ymd()}.csv`,['채무자키','채무자명','담당자','채권','잔액','집행권원','확정일','압류추심 횟수','제3채무자유형(지금까지)','마지막 압류추심','시효도래일'],
    l.map(x=>[x.d.key,x.d.name,x.d.owner,x.d.pf,x.d.bal,x.title.t,ds(x.title.conf),x.sz.length,x.types.join(' · '),x.last?ds(x.last.ap):'',x.sihyo<FAR?ds(x.sihyo):'']))}
const noData=(t,body)=>`<div class="card"><div class="cb" style="padding:34px 26px"><b style="font-size:15px">${t}</b><p class="sub" style="margin:8px 0 14px">${body}</p><button class="btn" onclick="go('data')">회수 자료 넣기로</button></div></div>`;
function statTax(){if(!ACT.some(a=>a.ttype))return noData('제3채무자유형 자료가 없어요','법조치 원자료의 「제3채무자유형」(예금 · 예금+세무서 · 세무서 · 보험+세무서 …) 칸을 <b>칸 맞추기</b>에서 공통 양식 「제3채무자유형」에 연결해 넣으면, 세무서 압류를 한 번도 안 한 집행권원 확보 채무자를 뽑아 드려요.');
  const all=taxRows(),no=all.filter(x=>!x.tax),noAct=no.filter(x=>!x.sz.length),bal=no.reduce((a,x)=>a+x.d.bal,0);
  const F=ST.tf||(ST.tf={o:'',min:0,none:false,sort:'bal'});
  const by=(f,keys)=>{const m=new Map();for(const x of all){const k=f(x);if(!m.has(k))m.set(k,{n:0,no:0,bal:0});const o=m.get(k);o.n++;if(!x.tax){o.no++;o.bal+=x.d.bal}}return (keys||[...m.keys()]).filter(k=>m.has(k)).map(k=>[k,m.get(k)])};
  const sub=(title,rows)=>card(title,'','',`<div class="cb flush"><div class="tw" style="max-height:320px"><table class="xl"><thead><tr><th>${title.split(' ')[0]}</th><th class="n">집행권원</th><th class="n">세무서 미압류</th><th class="n">비율</th><th class="n">미압류 잔액</th></tr></thead><tbody>
    ${rows.map(([k,o])=>`<tr><td>${hx(k)}</td><td class="n">${o.n.toLocaleString()}</td><td class="n"><b>${o.no.toLocaleString()}</b></td><td class="n">${pct(o.no/o.n,0)}</td><td class="n">${man(o.bal)}</td></tr>`).join('')}</tbody></table></div></div>`);
  const lim=ST.tlim||100,soon=x=>x.sihyo<FAR&&x.sihyo-TODAY<=365;
  const L=no.filter(x=>(!F.o||x.d.owner===F.o)&&x.d.bal>=F.min&&(!F.none||!x.sz.length)).sort(F.sort==='sihyo'?(a,b)=>a.sihyo-b.sihyo:(a,b)=>b.d.bal-a.d.bal);
  return kpiRow([['집행권원 확보 채무자',all.length.toLocaleString()+'명','확정된 지급명령·판결이 있는 사람'],['세무서 압류한 적 있음',(all.length-no.length).toLocaleString()+'명',pct((all.length-no.length)/Math.max(1,all.length),0)],
      ['세무서 미압류',no.length.toLocaleString()+'명',`${pct(no.length/Math.max(1,all.length),0)} · 압류추심 한 번도 없음 ${noAct.length.toLocaleString()}명`,'down'],['미압류 잔액',man(bal),'국세환급금 압류 후보']])+
   `<div class="note" style="margin:0 0 14px">02_법조치 <b>「제3채무자유형」</b>(예금 · 예금+세무서 · 세무서 · 보험+세무서 …)에 「세무서」가 한 번도 없는 사람이에요. 세무서(국세환급금) 압류를 아직 안 한 집행권원 확보 채무자 목록이에요.</div>
   <div class="g2" style="margin-bottom:14px">${sub('담당자별',by(x=>x.d.owner,OWNERS))}${sub('잔액 구간별',by(x=>band(x.d.bal),BANDS))}</div>`+
   card('세무서 미압류 목록',`${F.sort==='sihyo'?'시효 가까운':'잔액 큰'} 순 · ${Math.min(lim,L.length).toLocaleString()} / ${L.length.toLocaleString()}명`,`<button class="btn sm" onclick="expTax()">목록 엑셀</button>`,
   `<div class="cb row" style="gap:8px;flex-wrap:wrap"><span class="sub">담당자</span><select onchange="ST.tf.o=this.value;ST.tlim=100;render()"><option value="">전체</option>${OWNERS.map(o=>`<option ${F.o===o?'selected':''}>${hx(o)}</option>`).join('')}</select>
     <span class="sub">잔액</span><select onchange="ST.tf.min=+this.value;render()">${[[0,'전체'],[1e6,'100만 이상'],[3e6,'300만 이상'],[1e7,'1,000만 이상']].map(([v,n])=>`<option value="${v}" ${F.min===v?'selected':''}>${n}</option>`).join('')}</select>
     <label class="sub"><input type="checkbox" ${F.none?'checked':''} onchange="ST.tf.none=this.checked;render()"> 압류추심 한 번도 없는 사람만</label><span style="flex:1"></span>
     ${segBtns(F.sort,[['bal','잔액 큰 순'],['sihyo','시효 가까운 순']],'ST.tf.sort')}</div><div class="cb flush"><div class="tw" style="max-height:560px"><table class="xl"><thead><tr><th>채무자</th><th>담당자</th><th class="n">잔액</th><th>집행권원</th><th class="n">압류추심</th><th>지금까지 제3채무자유형</th><th>마지막 압류추심</th><th>시효도래일</th></tr></thead><tbody>
   ${L.slice(0,lim).map(x=>`<tr><td><b>${x.d.key}</b> <span class="sub">${hx(x.d.name)}</span></td><td>${hx(x.d.owner)}</td><td class="n">${won(x.d.bal)}</td><td>${x.title.t} <span class="sub">${ds(x.title.conf)} 확정</span></td>
     <td class="n">${x.sz.length?x.sz.length+'회':'<span class="tag warn">없음</span>'}</td><td>${x.types.map(t=>`<span class="tag">${t}</span>`).join(' ')||'<span class="sub">–</span>'}</td><td class="nw">${x.last?ds(x.last.ap):'–'}</td><td class="nw">${x.sihyo<FAR?ds(x.sihyo):'–'}${soon(x)?' <span class="tag red sm">1년 안</span>':''}</td></tr>`).join('')||'<tr><td colspan="8" class="sub">조건에 맞는 사람이 없어요</td></tr>'}</tbody></table></div>
   ${L.length>lim?`<div class="cb" style="text-align:center"><button class="btn sm" onclick="ST.tlim=(ST.tlim||100)+200;render()">200명 더 보기</button></div>`:''}</div>`)}

// ② 실효·폐지 대상 × 급여 압류추심
const ADJK=[['개인회생 폐지','개인회생','폐지'],['파산 폐지','파산','폐지'],['신용회복 실효','신용회복','실효']];
function adjRows(){if(ST._adj&&ST._adj.v===ST.gpf)return ST._adj.l;const out=[];
  for(const d of SD())for(const x of d.adj||[]){if(x.st!=='폐지'&&x.st!=='실효')continue;const g=ADJK.find(k=>k[1]===x.kind&&k[2]===x.st);if(!g)continue;
    const wage=d.acts.filter(a=>a.t==='급여 압류추심'),before=wage.filter(a=>a.ap<x.day),after=wage.filter(a=>a.ap>=x.day);
    const pafter=d.pays.filter(p=>p.kind==='추심금'&&p.act&&p.act.t==='급여 압류추심'&&p.day>=x.day),pbefore=d.pays.filter(p=>p.kind==='추심금'&&p.act&&p.act.t==='급여 압류추심'&&p.day<x.day);
    const co=[...before].reverse().map(a=>(a.third||[])[0]).find(Boolean)||'';
    out.push({d,x,g:g[0],before:before.length>0,after:after[0]||null,gap:after[0]?after[0].ap-x.day:null,got:pafter.reduce((a,p)=>a+p.amt,0),hadPay:pbefore.length>0,co,src:x.src||''})}
  ST._adj={v:ST.gpf,l:out};return out}
function expAdj(){const l=adjRows().filter(r=>!r.after).sort((a,b)=>(b.hadPay-a.hadPay)||(b.d.bal-a.d.bal));
  downloadCSV(`실효폐지 급여압류 후보_${ymd()}.csv`,['채무자키','채무자명','담당자','구분','실효·폐지일','지난 날','전에 급여 압류','전에 압류한 회사','전에 급여 추심금','잔액'],
    l.map(r=>[r.d.key,r.d.name,r.d.owner,r.g,ds(r.x.day),TODAY-r.x.day,r.before?'있음':'없음',r.co,r.hadPay?'있음':'없음',r.d.bal]))}
function statAdj(){if(!DEBT.some(d=>d.adj&&d.adj.length))return noData('채무조정 자료가 없어요','<b>08_채무조정</b>(채무자키 · 구분: 개인회생·파산·신용회복 · 상태: 진행·인가·폐지·실효·면책·완제 · 상태일)을 담아 넣거나, 종합관리 <b>회생·파산 관리</b>에서 폐지결정이 난 사건이 있으면 여기 보여요.');
  const R=adjRows(),aft=R.filter(r=>r.after),got=R.reduce((a,r)=>a+r.got,0),todo=R.filter(r=>!r.after),hot=todo.filter(r=>r.hadPay);
  const grp=ADJK.map(([g])=>{const l=R.filter(r=>r.g===g),a=l.filter(r=>r.after);return{g,n:l.length,before:l.filter(r=>r.before).length,after:a.length,gap:med(a.map(r=>r.gap)),got:l.reduce((s,r)=>s+r.got,0),per:a.length?l.reduce((s,r)=>s+r.got,0)/a.length:null,todo:l.length-a.length}});
  const ms=lastMonths(24,TODAY),mrows=ms.map(m=>{const l=R.filter(r=>ym(r.x.day)===m);return{l:m,s:m.slice(2).replace('-','.'),v:{a:l.filter(r=>r.after).length,b:l.filter(r=>!r.after).length}}});
  const ag=ST.ag||'',lim=ST.alim||60,T2=todo.filter(r=>!ag||r.g===ag).sort((a,b)=>(b.hadPay-a.hadPay)||(b.d.bal-a.d.bal));
  return kpiRow([['실효·폐지 대상',R.length.toLocaleString()+'명',grp.map(g=>`${g.g.split(' ')[0]} ${g.n}`).join(' · ')],['그 뒤 급여 압류추심',aft.length.toLocaleString()+'명',`${pct(aft.length/Math.max(1,R.length),0)} · 걸린 날 중앙값 ${med(aft.map(r=>r.gap))??'–'}일`],
      ['그 뒤 급여 추심금',man(got),`압류한 사람 1인당 ${man(aft.length?got/aft.length:0)}`],['아직 급여 압류 안 함',todo.length.toLocaleString()+'명',`그중 전에 급여 추심금 있던 사람 ${hot.length.toLocaleString()}명`,'down']])+
   `<div class="note" style="margin:0 0 14px">대상 = 개인회생·파산 <b>폐지</b>(08_채무조정 + 종합관리 회생·파산 관리의 폐지결정 ${R.filter(r=>r.src==='rehab').length.toLocaleString()}건) · 신용회복 <b>실효</b>(08_채무조정). 폐지·실효 뒤에는 멈췄던 집행을 다시 할 수 있어요 — 전에 급여 추심금이 들어오던 사람(같은 직장일 가능성)부터 보세요.</div>
   <div class="gside" style="margin-bottom:14px"><div class="stack">${card('구분별','','',`<div class="cb flush"><div class="tw"><table class="xl"><thead><tr><th>구분</th><th class="n">대상</th><th class="n">전에 급여 압류</th><th class="n">뒤 급여 압류</th><th class="n">비율</th><th class="n">걸린 날 (중앙)</th><th class="n">뒤 급여 추심금</th><th class="n">1인당</th><th class="n">아직 안 함</th></tr></thead><tbody>
     ${grp.map(g=>`<tr><td><b>${g.g}</b></td><td class="n">${g.n.toLocaleString()}</td><td class="n">${g.before.toLocaleString()}</td><td class="n"><b>${g.after.toLocaleString()}</b></td><td class="n">${pct(g.after/Math.max(1,g.n),0)}</td><td class="n">${g.gap??'–'}일</td><td class="n">${man(g.got)}</td><td class="n">${g.per==null?'–':man(g.per)}</td><td class="n">${g.todo.toLocaleString()}</td></tr>`).join('')}
     <tr class="total"><td>전체</td><td class="n">${R.length.toLocaleString()}</td><td class="n">${R.filter(r=>r.before).length.toLocaleString()}</td><td class="n">${aft.length.toLocaleString()}</td><td class="n">${pct(aft.length/Math.max(1,R.length),0)}</td><td class="n">${med(aft.map(r=>r.gap))??'–'}일</td><td class="n">${man(got)}</td><td class="n">${man(aft.length?got/aft.length:0)}</td><td class="n">${todo.length.toLocaleString()}</td></tr></tbody></table></div></div>`)}</div>
     ${card('월별 실효·폐지','그 달에 실효·폐지된 사람 · 최근 24개월','<span class="legend"><span><i style="background:var(--text)"></i>뒤에 급여 압류함</span><span><i style="background:var(--line2)"></i>아직 안 함</span></span>',stackBars(mrows,['a','b'],{a:'var(--text)',b:'var(--line2)'},v=>v+'명'))}</div>`+
   card('급여 압류 후보 (실효·폐지 뒤 아직 안 함)',`전에 급여 추심금 있던 사람 먼저 · ${Math.min(lim,T2.length)} / ${T2.length.toLocaleString()}명`,`<button class="btn sm" onclick="expAdj()">후보 엑셀</button>`,
   `<div class="cb">${segBtns(ag,[['','전체'],...ADJK.map(k=>[k[0],k[0]])],'ST.ag')}</div><div class="cb flush"><div class="tw" style="max-height:520px"><table class="xl"><thead><tr><th>채무자</th><th>담당자</th><th>구분</th><th>실효·폐지일</th><th class="n">지난 날</th><th>전에 급여 압류</th><th>전에 압류한 회사</th><th>전에 급여 추심금</th><th class="n">잔액</th></tr></thead><tbody>
   ${T2.slice(0,lim).map(r=>`<tr><td><b>${r.d.key}</b> <span class="sub">${hx(r.d.name)}</span></td><td>${hx(r.d.owner)}</td><td>${r.g}</td><td class="nw">${ds(r.x.day)}</td><td class="n">${(TODAY-r.x.day).toLocaleString()}일</td>
     <td>${r.before?'<span class="tag">있음</span>':'<span class="sub">없음</span>'}</td><td>${r.co?hx(r.co):'<span class="sub">–</span>'}</td><td>${r.hadPay?'<span class="tag ok">있음 · 같은 직장 확인</span>':'<span class="sub">없음</span>'}</td><td class="n">${won(r.d.bal)}</td></tr>`).join('')||'<tr><td colspan="9" class="sub">후보가 없어요</td></tr>'}</tbody></table></div>
   ${T2.length>lim?`<div class="cb" style="text-align:center"><button class="btn sm" onclick="ST.alim=(ST.alim||60)+200;render()">200명 더 보기</button></div>`:''}</div>`)}

// ③ 입금유형별 (월 · 연)
const PCOL={'추심금':'#141414','배당금':'#4a4a4a','공탁금':'#7a7a7a','본인변제':'#3a67d8','약정분납':'#86a8f0','보증인':'#a9a9a9','제3자':'#c4c4c4','상계':'#d9d9d9','기타':'#e8e8e8'};
function statPay(){const per=ST.sPer||'m',val=ST.sVal||'amt',nm=+(ST.sN||24),ds_=new Set(SD()),share=val==='pct';
  const keyOf=d=>per==='m'?ym(d):ds(d).slice(0,4);
  const ys=new Set();for(const p of PAY)ys.add(ds(p.day).slice(0,4));const periods=per==='m'?lastMonths(nm,TODAY):[...ys].sort();
  const M=new Map(periods.map(k=>[k,{}]));
  for(const p of PAY){if(ST.gpf&&!ds_.has(p.d))continue;const k=keyOf(p.day),o=M.get(k);if(!o)continue;const x=o[p.kind]||(o[p.kind]={amt:0,n:0});x.amt+=p.amt;x.n++}
  const kinds=PAYK.filter(k=>periods.some(pp=>M.get(pp)[k]));const v=(o,k)=>o[k]?o[k][share?'amt':val]:0;const f0=val==='n'?(x=>x.toLocaleString()+'건'):man;
  const ptot=pp=>kinds.reduce((a,k)=>a+v(M.get(pp),k),0),f=f0;
  const tot=periods.map(ptot),all=tot.reduce((a,b)=>a+b,0);
  const cell=(pp,k)=>{const x=v(M.get(pp),k);if(!x)return '<span class="sub">–</span>';return share?pct(x/Math.max(1,ptot(pp)),0):f(x)};
  const DIR=['추심금','배당금','공탁금'],LNK=['본인변제','약정분납'],sumK=ks=>periods.reduce((a,pp)=>a+ks.reduce((b,k)=>b+(M.get(pp)[k]?M.get(pp)[k].amt:0),0),0),amtAll=sumK(kinds);
  const rows=periods.map((pp,i)=>({l:pp,s:(per==='m'?pp.slice(2).replace('-','.'):pp)+(pp===keyOf(TODAY)?'*':''),v:Object.fromEntries(kinds.map(k=>[k,v(M.get(pp),k)]))}));
  let first=TODAY;for(const p of PAY)if(p.day<first)first=p.day;const fk=keyOf(first);
  // 진행 중(이번 달·올해) · 자료가 중간부터 있는 첫 기간은 일부만 있어 비교에서 뺌
  const isPart=pp=>pp===keyOf(TODAY)||(pp===fk&&ds(first).slice(per==='m'?8:5)!==(per==='m'?'01':'01-01'));
  const yoy=i=>i>0&&tot[i-1]&&!isPart(periods[i])&&!isPart(periods[i-1])?(tot[i]-tot[i-1])/tot[i-1]:null;
  return `<div class="tbar" style="margin:0 0 14px"><span class="sub">기간</span>${segBtns(per,[['m','월별'],['y','연별']],'ST.sPer')}${per==='m'?segBtns(String(nm),[['12','12개월'],['24','24개월'],['36','36개월']],'ST.sN'):''}<span class="sub">값</span>${segBtns(val,[['amt','금액'],['n','건수'],['pct','비중']],'ST.sVal')}<span style="flex:1"></span><button class="btn sm" onclick="expPay()">표 엑셀</button></div>`+
   kpiRow([['이 기간 입금',man(amtAll),periods[0]+' ~ '+periods[periods.length-1]],['직접 회수 (추심·배당·공탁)',man(sumK(DIR)),pct(sumK(DIR)/Math.max(1,amtAll),0)],['연계 (본인변제·약정분납)',man(sumK(LNK)),pct(sumK(LNK)/Math.max(1,amtAll),0)],['그 밖 (보증인·제3자 등)',man(amtAll-sumK(DIR)-sumK(LNK)),pct((amtAll-sumK(DIR)-sumK(LNK))/Math.max(1,amtAll),0)]])+
   card(`입금유형별 ${per==='m'?'월별':'연별'} ${val==='n'?'건수':'금액'}`,`04_입금 입금구분 · 합계 ${f(all)} · * 진행 중`,`<span class="legend">${kinds.map(k=>`<span><i style="background:${PCOL[k]}"></i>${k}</span>`).join('')}</span>`,stackBars(rows,kinds,PCOL,f))+
   `<div style="height:14px"></div>`+card('표','검정 = 법조치가 직접 만든 돈 · 파랑 = 법조치 뒤 반응한 돈','',`<div class="cb flush"><div class="tw" style="max-height:560px"><table class="xl"><thead><tr><th>${per==='m'?'월':'연'}</th>${kinds.map(k=>`<th class="n">${k}</th>`).join('')}<th class="n">합계</th>${per==='y'?'<th class="n">작년보다</th>':''}</tr></thead><tbody>
   ${periods.map((pp,i)=>`<tr><td class="nw"><b>${pp}</b>${pp===keyOf(TODAY)?' <span class="sub">(진행 중)</span>':isPart(pp)?' <span class="sub">(일부)</span>':''}</td>${kinds.map(k=>`<td class="n">${cell(pp,k)}</td>`).join('')}<td class="n"><b>${f(tot[i])}</b></td>${per==='y'?`<td class="n">${yoy(i)==null?'–':`<span class="${yoy(i)<0?'down':''}">${yoy(i)>0?'+':''}${pct(yoy(i),0)}</span>`}</td>`:''}</tr>`).join('')}
   <tr class="total"><td>비중</td>${kinds.map(k=>`<td class="n">${pct(periods.reduce((a,pp)=>a+v(M.get(pp),k),0)/Math.max(1,all),0)}</td>`).join('')}<td class="n">100%</td>${per==='y'?'<td></td>':''}</tr></tbody></table></div></div>`)}
function expPay(){const per=ST.sPer||'m',val=ST.sVal||'amt';const t=[...document.querySelectorAll('#view table')].pop();if(t)xlView()}
V.stats=()=>{const tab=ST.sTab||'tax';

    :`<path d="M${X(c.day)} 100 l6 8 l-6 8 l-6 -8 z" fill="var(--sub)"><title>${c.kind} ${ds(c.day)}</title></path>`).join('');
  const bars=pays.map(({p,k})=>{const h=Math.max(3,p.amt/pm*80);return `<rect x="${X(p.day)-1.5}" y="${H-30-h}" width="4" height="${h}" rx="1" fill="${col[k]}"><title>${ds(p.day)} ${p.kind} ${won(p.amt)} · ${k}</title></rect>`}).join('');
  const sum=k=>pays.filter(x=>x.k===k).reduce((s,x)=>s+x.p.amt,0);
  const ev=[...d.acts.flatMap(a=>[{day:a.ap,g:'법조치',t:`${a.t} 신청`,s:`${a.no} · ${a.court}`},...(a.cite?[{day:a.cite,g:'법조치',t:`${a.t} 인용`,s:a.banks.length?a.banks.map(r=>`${r.bank.replace('은행','')} ${man(r.alloc)}`).join(' · '):''}]:[]),...(a.conf?[{day:a.conf,g:'법조치',t:`${a.t} 확정`,s:'집행권원'}]:[{day:a.sv,g:'법조치',t:`${a.t} 송달`,s:a.res}])]),
    ...d.cons.map(c=>({day:c.day,g:c.kind==='약정'?'조정':'연락',t:c.kind,s:c.res+(c.act?` · ${c.act.t} 뒤`:'')})),

    ...d.ecol.map(e=>({day:e.day,g:'전자추심',t:`${e.bank} 추심 요청`,amt:e.amt,s:e.a.t})),
    ...pays.map(({p,at,k})=>({day:p.day,g:'입금',t:p.kind,amt:p.amt,s:k==='무관'?'<span class="faint">연결 없음</span>':`<span class="tag ${k==='직접'?'dark':'acc'}">${k}</span> ${at.a.t}${k==='연계'&&p.kind!=='약정분납'?` 송달 ${p.day-at.a.sv}일 뒤`:''}`}))].sort((a,b)=>a.day-b.day);

  `<div class="card hero"><div><span>채무자</span><b>${d.key}</b><em>${d.name} · ${d.age} ${d.sex} · ${d.owner}</em></div><div><span>잔액</span><b>${won(d.bal)}</b><em>${d.prior?'과거 12개월 입금 있음':'과거 입금 없음'}</em></div>
   <div><span>법조치</span><b>${d.acts.length}건</b><em>비용 ${man(d.acts.reduce((s,a)=>s+a.cost,0))}</em></div>
   <div><span>직접 · 연계 회수</span><b>${man(sum('직접'))} · ${man(sum('연계'))}</b><em>연결 없는 입금 ${man(sum('무관'))}</em></div>
   <div><span>계좌 · 가장 이른 시효</span><b style="font-size:15px">${d.accts.length}개 · ${ds(Math.min(...d.accts.map(x=>x.sihyo)))}</b><em>${d.rels.length?`해제 ${d.rels.length}건`:''}${d.ecol.length?` · 전자추심 ${d.ecol.length}건`:''}</em></div></div>
  ${card('타임라인','',`<span class="legend"><span><i style="background:var(--text)"></i>직접</span><span><i style="background:var(--acc)"></i>연계</span><span><i style="background:var(--line2)"></i>연결 없음</span><span><i style="background:var(--acc-soft)"></i>연계 기간 ${S.conN}일</span></span>`,

function rcSummary(){const mr=missRows(),gc={ready:0,check:0,low:0,block:0};openP().forEach(p=>gc[group(p)]++);
  const o=typeSum(LA().filter(a=>a.sv>TODAY-365-S.conN));let inc=0,cost=0;for(const t of LTN){inc+=o[t].inc;cost+=o[t].cost}
  return{mode:DATA_MODE,asof:ds(TODAY),miss:mr.length,missAmt:0,ready:gc.ready,check:gc.check+gc.block,next:recs().filter(r=>r.best&&r.best.avg>=S.minGain).length,net:inc-cost,missTxt:`시효 임박 ${mr.filter(x=>x.kind==='시효 임박').length} · 추심 안 함 ${mr.filter(x=>x.kind==='추심 안 함').length}`,netTxt:man(inc-cost)}}
if(EMBED)window.addEventListener('message',e=>{const d=e.data||{};

// 화면 표 → 엑셀 (보이는 줄 그대로)
function xlView(){const ts=[...document.querySelectorAll('#view table')];if(!ts.length){toast('이 화면에는 표가 없어요');return}
  const t=ts.reduce((a,b)=>b.rows.length>a.rows.length?b:a),txt=c=>c.innerText.replace(/\s+/g,' ').trim();
  const hr=t.tHead&&t.tHead.rows.length?t.tHead.rows[t.tHead.rows.length-1]:t.rows[0];
  const body=[...t.rows].filter(r=>r!==hr&&!(t.tHead&&t.tHead.contains(r))).map(r=>[...r.cells].map(c=>{const v=txt(c);return /^-?[\d,]+(원)?$/.test(v)&&v.replace(/[,원-]/g,'')?Number(v.replace(/[,원]/g,'')):v}));
  downloadCSV(`${ST.gpf||'전체 채권'} ${(MN[ST.view]||'회수 분석').replace(/ /g,'')}_${ymd()}.csv`,[...hr.cells].map(txt),body)}
function snap(){const SD={};for(const x of STD)if(S[x.k]!==x.v)SD[x.k]=S[x.k];
  const H=[...ST.handled].filter(([k])=>typeof k==='string').map(([id,h])=>[id,{what:h.what,date:h.date,memo:h.memo,closed:!!h.closed,owner:h.owner||(h.x&&h.x.d?h.x.d.owner:''),kind:h.kind||(h.x?h.x.kind:'')}]);
  return{v:1,S:SD,relMap:ST.relMap,decisions:ST.decisions,planSent:ST.planSent||null,stdLog:ST.stdLog.slice(0,200),handled:H.concat(ST.handledOld)}}
let SAVE_T=null,LAST_SNAP='';
function queueSave(){if(!HAS_API)return;clearTimeout(SAVE_T);SAVE_T=setTimeout(saveNow,700)}
async function saveNow(){if(!HAS_API)return;let s;try{s=JSON.stringify(snap())}catch(e){return}if(s===LAST_SNAP)return;LAST_SNAP=s;
  try{await apiP('rc_state_save',{state:JSON.parse(s),demo:DATA_MODE==='demo'})}catch(e){LAST_SNAP='';toast('기록을 저장하지 못했어요: '+(e.message||e))}}
function resetStd(){const re=['citeLag','svLagS','svLagO'].some(k=>S[k]!==STD.find(x=>x.k===k).v);STD.forEach(x=>S[x.k]=x.v);ACT.forEach(a=>{const c=S['cost:'+a.t];if(c!=null)a.cost=c});ST.ver++;
  if(re){toast('처음 값으로 — 자료를 다시 조립합니다');saveNow().then(()=>location.reload());return}render();toast('처음 값으로 되돌림')}
function appStart(st){
  if(st){if(st.relMap)ST.relMap=st.relMap;if(Array.isArray(st.stdLog))ST.stdLog=st.stdLog;if(st.planSent)ST.planSent=st.planSent;
    if(Array.isArray(st.decisions)){ST.decisions=st.decisions;const ids=new Set(st.decisions.map(x=>x.pid));PENDING.forEach(p=>{if(ids.has(p.id))p.done=true})}
    ST.ver++;
    if(Array.isArray(st.handled)&&st.handled.length){const idx=new Map(stopItems().map(x=>[x.id,x]));
      for(const [id,h] of st.handled){const x=idx.get(id);if(x)ST.handled.set(id,Object.assign({},h,{x}));else ST.handledOld.push([id,h])}}}
  else if(DATA_MODE==='demo'){  // 처음 보는 예시 자료: 처리한 것 몇 건
    stopItems().filter(x=>x.kind!=='시효 임박').slice(0,5).forEach((x,i)=>ST.handled.set(x.id,{x,what:MOPT[x.kind][0],date:ds(TODAY-3-i*4),memo:i===0?'담당자 통화, 다음 주 지급 예정':'',closed:i%3===0}))}
  if(DATA_MODE==='real')ST.stdLog=ST.stdLog.filter(x=>x.memo!=='2026.7.1 시행 반영'||st);
  if(EMBED)ST.view=(BOOT_WANT&&V[BOOT_WANT]?BOOT_WANT:'')||location.hash.slice(1)||'dash';
  if(!V[ST.view])ST.view='dash';
  document.getElementById('gpf').innerHTML='<option value="">모든 채권</option>'+PFS.map(x=>`<option>${hx(x)}</option>`).join('');
  document.getElementById('rowsN').innerHTML=`채무자 ${DEBT.length.toLocaleString()}명 · 법조치 ${ACT.length.toLocaleString()}건<br>${ym(W0)} ~ ${ym(TODAY)} · ${DATA_MODE==='real'?'넣은 자료':'예시 자료'}`;
  document.getElementById('dmode').textContent=DATA_MODE==='real'?'자료 기준일 '+ds(TODAY):'예시 자료';
  const r0=render;render=function(){r0();queueSave()};
  LAST_SNAP=st?JSON.stringify(snap()):'';
  APP_ON=true;BOOTED=true;render();flushAsk()}
appStart(window.__rcState);

<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>법조치 회수 분석 시안</title>
<style>
:root,[data-theme="light"]{
  --bg:#f4f4f3; --panel:#fff; --panel2:#f8f8f7; --hover:#f2f2f1; --line:#e7e7e5; --line2:#d6d6d3;
  --text:#141414; --sub:#66666b; --faint:#a0a0a5; --side:#0a0a0a; --side-text:#9b9b9b;
  --btn:#141414; --btn-text:#fff; --acc:#365abd; --acc-soft:rgba(54,90,189,.09);
  --ok:#1b8a4e; --ok-soft:#e8f5ed; --warn:#b06f08; --warn-soft:#fcf3e2; --bad:#cf3f3f; --bad-soft:#fdeeee;
  --shadow:0 1px 2px rgba(20,20,20,.04),0 2px 8px rgba(20,20,20,.03);
}
[data-theme="dark"]{
  --bg:#0b0b0c; --panel:#141416; --panel2:#1a1a1d; --hover:#1f1f23; --line:#26262b; --line2:#36363d;
  --text:#ededee; --sub:#a1a1a8; --faint:#6c6c75; --side:#070708; --side-text:#9a9aa2;
  --btn:#ededee; --btn-text:#0b0b0c; --acc:#7f9cf0; --acc-soft:rgba(127,156,240,.13);
  --ok:#4fd08a; --ok-soft:rgba(79,208,138,.13); --warn:#efb14a; --warn-soft:rgba(239,177,74,.13); --bad:#ff7b7b; --bad-soft:rgba(255,123,123,.13);
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:13.5px;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.app{display:flex;height:100vh}
/* 왼쪽 메뉴 */
aside{width:220px;background:var(--side);color:var(--side-text);display:flex;flex-direction:column;padding:16px 12px;flex-shrink:0;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:2px 6px 16px}
.brand .logo{width:32px;height:32px;border-radius:10px;background:#fff;color:#0a0a0a;display:grid;place-items:center;font-weight:800;font-size:14px;letter-spacing:-.04em}
.brand b{color:#fff;font-size:15px;display:block;letter-spacing:-.03em}
.brand small{font-size:11px;color:#6c6c75}
.ml{font-size:11px;color:#55555c;padding:14px 10px 6px;font-weight:600;letter-spacing:.02em}
nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:var(--side-text);padding:8px 10px;border-radius:9px;text-align:left;font-weight:500;font-size:13.5px}
nav button:hover{color:#e5e5e5;background:#131316}
nav button.on{background:#202024;color:#fff}
nav button .pill{margin-left:auto;font-size:11px;background:#232328;color:#cfcfcf;padding:1px 7px;border-radius:20px;font-weight:600}
nav button .pill.red{background:rgba(255,107,107,.18);color:#ffaaaa}
.side-foot{margin-top:auto;font-size:11.5px;color:#5f5f66;line-height:1.7;padding:12px 8px 0;border-top:1px solid #18181b}
/* 위 줄 */
main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-shrink:0}
.top .crumb{font-size:13px;color:var(--sub)} .top .crumb b{color:var(--text);font-weight:650}
.top .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;border:1px solid var(--line);border-radius:20px;padding:4px 10px;color:var(--sub);background:var(--panel);white-space:nowrap}
.chip.demo{color:var(--warn);background:var(--warn-soft);border-color:transparent;font-weight:700}
.iconbtn{width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);display:grid;place-items:center;color:var(--sub)}
.iconbtn:hover{color:var(--text);background:var(--hover)}
.view{flex:1;overflow:auto;padding:20px 24px 56px}
/* 머리 */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.035em}
.ph p{margin:4px 0 0;color:var(--sub);font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 13px;border-radius:10px;font-weight:550;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:13px}
.btn:hover{background:var(--hover)}
.btn.p{background:var(--btn);border-color:var(--btn);color:var(--btn-text)}
.btn.p:hover{opacity:.9}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;padding:2px;background:var(--panel2)}
.seg button{border:0;background:none;padding:4px 11px;border-radius:8px;font-size:12.5px;color:var(--sub);font-weight:550;white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* 카드 */
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.ch{display:flex;align-items:center;gap:8px 10px;padding:14px 16px 0;flex-wrap:wrap}
.ch h3{margin:0;font-size:14.5px;font-weight:700;letter-spacing:-.025em}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cb{padding:12px 16px 16px}
.cb.flush{padding:10px 0 0}
.sub{color:var(--sub);font-size:12.5px}
.nw{white-space:nowrap}
.faint{color:var(--faint)}
.up{color:var(--ok)!important} .down{color:var(--bad)!important}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.gside{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
.stack{display:grid;gap:14px;min-width:0}
/* 숫자 카드 */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{padding:13px 14px 10px}
.kpi span{font-size:12px;color:var(--sub);font-weight:500}
.kpi b{display:block;font-size:22px;font-weight:700;letter-spacing:-.04em;margin:3px 0 1px;white-space:nowrap}
.kpi em{font-style:normal;font-size:12px;color:var(--sub);display:block;line-height:1.4}
.kpi svg{display:block;width:100%;height:26px;margin-top:8px;overflow:visible}
/* 표 */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;color:var(--sub);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1;white-space:nowrap}
th.s{cursor:pointer} th.s:hover{color:var(--text)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
td.n{white-space:nowrap}
td.nw{white-space:nowrap}
tbody tr:hover{background:var(--hover)}
tbody tr.sel{background:var(--acc-soft)}
tbody tr.total{font-weight:700;background:var(--panel2)}
tr.click{cursor:pointer}
.tw{overflow:auto;max-height:calc(100vh - 250px)}
.card>.tw{border-top:1px solid var(--line);border-radius:0 0 14px 14px}
.cb.flush>.tw{border-top:1px solid var(--line)}
.tw table td:first-child,.tw table th:first-child{padding-left:16px}
.tw table td:last-child,.tw table th:last-child{padding-right:16px}
table.xl td{user-select:none}
table.xl td.cs{background:var(--acc-soft)!important;box-shadow:inset 0 0 0 1px var(--acc)}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);color:var(--sub);white-space:nowrap}
.tag.red{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.tag.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.tag.acc{background:var(--acc-soft);border-color:transparent;color:var(--acc)}
.tag.dark{background:var(--text);border-color:var(--text);color:var(--bg)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
select,.in{border:1px solid var(--line);background:var(--panel);border-radius:9px;padding:6px 9px;font-size:13px}
.in.num{width:118px;text-align:right}
.tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid transparent;background:none;padding:6px 13px;color:var(--sub);font-weight:600;border-radius:20px;font-size:13px}
.tabs button:hover{background:var(--hover)}
.tabs button.on{color:var(--bg);background:var(--text)}
.tabs button .c{font-weight:500;opacity:.7;margin-left:4px}
.note{font-size:12.5px;color:var(--sub);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;line-height:1.6}
.note b{color:var(--text)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)} .note.warn b{color:var(--warn)}
.note.red{background:var(--bad-soft);border-color:transparent;color:var(--bad)} .note.red b{color:var(--bad)}
/* 깔때기 */
.fun{display:grid;gap:4px}
.fun .fr{display:grid;grid-template-columns:150px minmax(0,1fr) 80px;gap:12px;align-items:center;font-size:13px}
.fun .bar{height:24px;background:var(--panel2);border-radius:7px;overflow:hidden}
.fun .bar i{display:block;height:100%;background:var(--text);border-radius:7px}
.fun .fr.last .bar i{background:var(--ok)}
.fun .r{text-align:right;font-weight:700}
.fun .cv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:12px;font-size:11.5px;color:var(--sub)}
.fun .cv span{padding-left:6px}
/* 범위 막대 */
.rng{position:relative;height:14px;width:110px;display:inline-block;vertical-align:middle}
.rng .ln{position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line);border-radius:2px}
.rng .ci{position:absolute;top:3px;height:8px;background:var(--faint);opacity:.45;border-radius:3px}
.rng .pt{position:absolute;top:1px;width:3px;height:12px;background:var(--text);border-radius:2px}
/* 묶어 보기 */
.heat td.hc{text-align:center;font-weight:650;cursor:pointer;min-width:76px;border-left:1px solid var(--panel)}
.heat td.hc small{display:block;font-weight:500;font-size:10.5px;opacity:.75}
.heat td.hc.hide{color:var(--faint);font-weight:500;background:repeating-linear-gradient(45deg,var(--panel2) 0 6px,var(--panel) 6px 12px)}
.heat td.hc.few{outline:1.5px dashed var(--warn);outline-offset:-4px}
.heat td.hc.pick{outline:2px solid var(--acc);outline-offset:-2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--sub);align-items:center}
.legend i{display:inline-block;width:14px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.fchip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:2px 4px 2px 11px;background:var(--panel2);font-size:12.5px}
.fchip.on{border-color:var(--text);background:var(--panel)}
.fchip select{border:0;background:none;padding:3px 2px;font-weight:650}
.fchip button{border:0;background:none;width:22px;height:22px;border-radius:50%;color:var(--sub)}
.fchip button:hover{background:var(--hover);color:var(--text)}
select.addf{border-style:dashed;border-radius:20px;color:var(--sub)}
/* 값 종류 */
.v-est{font-style:italic;border-bottom:1.5px dotted var(--sub)}
.v-set{color:var(--acc);font-weight:650}
/* 사건 판단 */
.gcase{display:grid;grid-template-columns:236px minmax(0,1fr);gap:14px;align-items:start}
.clist{display:grid;gap:6px;max-height:calc(100vh - 300px);overflow:auto;padding-right:2px}
.ci-item{border:1px solid var(--line);border-radius:11px;padding:9px 11px;background:var(--panel);cursor:pointer;font-size:13px}
.ci-item:hover{background:var(--hover)}
.ci-item.on{border-color:var(--text);box-shadow:inset 3px 0 0 var(--text)}
.ci-item .t{display:flex;justify-content:space-between;gap:6px;font-weight:650}
.hero{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}
.hero div{padding:13px 16px;border-left:1px solid var(--line)}
.hero div:first-child{border-left:0}
.hero span{font-size:12px;color:var(--sub);display:block}
.hero b{font-size:19px;font-weight:700;letter-spacing:-.035em;display:block;margin-top:2px;white-space:nowrap}
.hero em{font-style:normal;font-size:11.5px;color:var(--sub)}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:9px;padding:7px 0;border-top:1px dashed var(--line);font-size:13px;align-items:flex-start}
.chk li:first-child{border-top:0}
.chk li i{font-style:normal;width:18px;height:18px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.chk li.ok i{background:var(--ok-soft);color:var(--ok)}
.chk li.warn i{background:var(--warn-soft);color:var(--warn)}
.chk li.bad i{background:var(--bad-soft);color:var(--bad)}
.chk li.info i{background:var(--acc-soft);color:var(--acc)}
.kv{display:grid;grid-template-columns:84px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--sub)} .kv dd{margin:0}
.pbar{display:inline-block;width:64px;height:6px;background:var(--panel2);border-radius:4px;vertical-align:middle;margin-right:6px;position:relative;overflow:hidden}
.pbar i{position:absolute;top:0;bottom:0;background:var(--line2)}
.pbar b{position:absolute;top:0;bottom:0;left:0;background:var(--text);border-radius:4px}
.alloc{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.alloc div{display:flex;flex-direction:column;justify-content:center;padding:0 8px;font-size:11px;font-weight:650;line-height:1.2;min-width:0;white-space:nowrap;overflow:hidden}
.alloc div small{font-weight:500;opacity:.8}
.dec{display:grid;gap:6px}
.dec label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 11px;cursor:pointer;font-size:13px;font-weight:550}
.dec label.on{border-color:var(--text);background:var(--panel2)}
textarea{width:100%;min-height:64px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:8px 10px;font-size:13px;resize:vertical}
.big{font-size:26px;font-weight:750;letter-spacing:-.04em}
/* 일괄 */
.selbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--text);color:var(--bg);border-radius:12px;margin-bottom:12px}
.selbar .btn{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.25)}
[data-theme="dark"] .selbar .btn{border-color:rgba(0,0,0,.25)}
.selbar .btn.p{background:var(--bg);color:var(--text);border-color:var(--bg)}
.selbar b{font-size:15px}
.bk{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin:1px 3px 1px 0;white-space:nowrap;background:var(--panel)}
.bk em{font-style:normal;color:var(--sub)}
/* 자료 넣기 */
.drop{border:1.5px dashed var(--line2);border-radius:14px;padding:24px;text-align:center;color:var(--sub);background:var(--panel)}
.drop b{color:var(--text);display:block;font-size:15px;margin-bottom:4px}
.issue{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-top:1px solid var(--line);font-size:13px}
.issue:first-child{border-top:0;padding-top:2px}
.issue .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:12px}
/* 할 일 */
.todo{display:grid;gap:8px}
.todo .t{display:grid;grid-template-columns:1fr auto;gap:2px 10px;border:1px solid var(--line);border-radius:11px;padding:10px 12px;cursor:pointer;font-size:13px;background:var(--panel)}
.todo .t:hover{background:var(--hover)}
.todo .t b{font-weight:650}
.todo .t .v{font-weight:750;text-align:right;white-space:nowrap}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--sub);font-size:10px;font-family:inherit}
.formula{font-size:12.5px;line-height:1.75;color:var(--sub)}
.formula p{margin:0 0 8px}
details>summary{cursor:pointer;font-size:13.5px;font-weight:700;list-style:none;padding:13px 16px}
details>summary::before{content:'▸ ';color:var(--sub)}
details[open]>summary::before{content:'▾ '}
.form{display:grid;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--sub)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--btn);color:var(--btn-text);padding:10px 18px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.tip{position:fixed;z-index:8;background:var(--btn);color:var(--btn-text);font-size:12px;line-height:1.55;padding:8px 10px;border-radius:9px;pointer-events:none;max-width:280px;display:none}
input[type=checkbox],input[type=radio]{width:15px;height:15px;accent-color:var(--text);margin:0}
/* 9차 */
.steps4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-bottom:14px}
.steps4>div{padding:14px 18px;border-left:1px solid var(--line)}
.steps4>div:first-child{border-left:0}
.steps4 i{font-style:normal;display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--text);color:var(--bg);font-size:12px;font-weight:800;margin-right:6px}
.steps4 b{font-size:14px}
.steps4 p{margin:6px 0 8px;font-size:12.5px;color:var(--sub);line-height:1.55}
@media (max-width:1500px){.actbar .kbd{display:none}}
@media (max-width:900px){.steps4{grid-template-columns:1fr 1fr}.steps4>div:nth-child(odd){border-left:0}}
/* 8차 */
details.card.fold>summary{display:flex;gap:10px;align-items:center;padding:14px 22px;font-size:15px}
details.card.fold>summary b{font-weight:700}
details.card.fold[open]>summary{padding-bottom:4px}
.bk.more{background:var(--panel2);color:var(--sub);cursor:default}
/* 7차 */
.chip.sm{font-size:11px;padding:2px 8px;vertical-align:1px}
.hl{cursor:pointer;color:var(--sub);text-decoration:underline;text-underline-offset:3px;margin-left:6px;font-size:12.5px}
.hl:hover{color:var(--text)}
.tbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-4px 0 14px}
/* 종합관리 안에 끼워 넣을 때 */
.ptabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin:-6px 0 16px;flex-wrap:wrap}
.ptabs button{border:0;background:none;padding:8px 0 10px;font-weight:650;color:var(--sub);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:14px}
.ptabs button:hover{color:var(--text)}
.ptabs button.on{color:var(--text);border-color:var(--text)}
.crumb{font-size:13px;color:var(--faint);margin-bottom:6px}
html.embed aside,html.embed .top{display:none}
html.embed{--bg:#f6f6f5;--panel:#fff;--panel2:#f8f8f7;--hover:#f6f6f5;--line:#e8e8e6;--line2:#d6d6d3;--text:#121212;--sub:#555;--faint:#6c6c6c;--btn:#121212;--btn-text:#fff;--ok:#14703c;--warn:#875300;--bad:#b8323a;--shadow:0 1px 2px rgba(0,0,0,.03)}
html.embed[data-theme="dark"]{--bg:#0b0b0b;--panel:#141414;--panel2:#191919;--hover:#1b1b1b;--line:#262626;--line2:#333;--text:#f0f0f0;--sub:#b8b8b8;--faint:#8f8f8f;--btn:#f0f0f0;--btn-text:#0b0b0b;--ok:#4fd08a;--warn:#efb14a;--bad:#ff7b7b;--shadow:none}
html.embed body{font-size:14px}
html.embed .view{padding:24px 34px 56px}
html.embed .view>*:not(.actbar):not(.drawer){max-width:1200px;margin-left:auto;margin-right:auto}
html.embed .card{border-radius:16px}
html.embed .ch{padding:18px 22px 0} html.embed .ch h3{font-size:16px;font-weight:600}
html.embed .cb{padding:14px 22px 20px} html.embed .cb.flush{padding:12px 0 0}
html.embed .tw table td:first-child,html.embed .tw table th:first-child{padding-left:22px}
html.embed .btn{padding:9px 15px;font-weight:500;font-size:14px} html.embed .btn.sm{padding:6px 11px;font-size:13px}

      if(R3()<.62){const amt=Math.round((1.2e5+R3()*3e5)/1e3)*1e3,n=2+Math.floor(R3()*10);for(let j=0;j<n;j++){const day=ap2+50+j*30;if(day<=T.asof)T.P.push([i,day,amt,0,-1,li,-1])}}}}});
  return T}
function clearAll(){for(const a of [DEBT,ACCT,ACT,PAY,CON,REL,ECOL,ALL_CASES,ALL_ROWS])a.length=0}

// 만든 예시 자료 → 저장 모양 (D 채무자 · A 계좌 · L 법조치 · B 제3채무자 · P 입금 · C 약정 · R 해제 · E 전자추심)
function toRows(){
  const di=new Map(),ai=new Map(),li=new Map(),bi=new Map(),T={v:1,asof:TODAY,D:[],A:[],L:[],B:[],P:[],PK:PAYK,PB:[],C:[],R:[],E:[]};
  const bIdx=b=>{if(!b)return -1;if(!bi.has(b)){bi.set(b,T.PB.length);T.PB.push(b)}return bi.get(b)};
  for(const d of DEBT){di.set(d,T.D.length);T.D.push([d.key,d.name,d.owner,d.pf,d.age,d.sex])}
  for(const a of ACCT){ai.set(a,T.A.length);T.A.push([a.key,di.get(a.d),a.bal,a.prin,a.fee,a.sihyo])}
  for(const a of ACT){li.set(a,T.L.length);T.L.push([a.id,di.get(a.d),ai.get(a.acct),a.t,a.court,a.no,a.ap,a.conf,a.g==='압류추심'?a.cite:null,null,a.owner,0]);
    for(const r of a.banks)T.B.push([li.get(a),r.bank,r.alloc])}
  // 전산에서 추심금에 법조치키가 빠지는 경우도 시험하려고 셋 중 하나는 법조치키를 비움
  PAY.forEach((p,i)=>T.P.push([di.get(p.d),p.day,p.amt,PAYK.indexOf(p.kind),bIdx(p.bank),p.act&&!(p.kind==='추심금'&&p.bank&&i%3===0)?li.get(p.act):-1,-1]));
  for(const c of CON)if(c.kind==='약정')T.C.push([di.get(c.d),c.cat,c.day,c.start,c.n,c.amt,c.n*c.amt,'',-1]);
  for(const r of REL)T.R.push([li.get(r.a),di.get(r.d),r.day,r.text,'','']);
  for(const e of ECOL)T.E.push([li.get(e.a),di.get(e.d),e.bank,e.day,e.amt]);
  clearAll();return T}

// 저장 모양 → 화면이 쓰는 채무자·법조치·은행 줄
function build(T){
  clearAll();TODAY=T.asof;
  let mn=TODAY;for(const l of T.L)if(l[6]<mn)mn=l[6];for(const p of T.P)if(p[1]<mn)mn=p[1];
  mn=Math.max(mn,TODAY-7*160);W0=mn-((mn+3)%7);NW=Math.max(1,Math.floor((TODAY-W0)/7));  // 주(월요일) 단위, 최대 3년
  const Ds=T.D.map(r=>({key:r[0],name:r[1]||r[0],owner:r[2]||'담당 없음',pf:r[3]||'',age:r[4]||'모름',sex:r[5]||'모름',accts:[],acts:[],pays:[],cons:[],rels:[],ecol:[],
    agree:null,hist:{},pw:new Float32Array(NW),prior:false,title0:null,bal:0,st:0}));
  const As=T.A.map(r=>{const d=Ds[r[1]],ac={key:r[0],d,bal:r[2]||0,prin:r[3]||0,fee:r[4]||0,sihyo:r[5]==null?FAR:r[5]};d.accts.push(ac);ACCT.push(ac);return ac});
  const Ls=T.L.map(r=>{const d=Ds[r[1]],t=LTYPES[r[3]]?r[3]:'기타',L=LTYPES[t],ap=r[6],conf=r[7];let cite=null,sv=r[9];
    if(L.g==='압류추심'){cite=r[8]!=null?r[8]:ap+S.citeLag;if(sv==null)sv=cite+S.svLagS}
    else if(sv==null){sv=ap+S.svLagO;if(conf!=null&&sv>conf)sv=Math.max(ap,conf-14)}
    const a={id:r[0],d,t,g:L.g,s:L.s,ap,sv,cite,conf,cost:S['cost:'+t]??L.cost,res:sv>TODAY?'진행 중':'인용',acct:r[2]>=0?As[r[2]]:d.accts[0],
      owner:r[10]||d.owner,banks:[],rel:null,no:r[5]||'',court:r[4]||'',svEst:r[9]==null,ttype:r[12]||'',third:[]};
    d.acts.push(a);return a});
  for(const d of Ds)d.acts.sort((x,y)=>x.ap-y.ap);
  const BB=new Map();for(const b of T.B){const a=Ls[b[0]];if(!BB.has(a))BB.set(a,[]);BB.get(a).push(b)}
  for(const [a,bl] of BB)if(!BANKT.includes(a.t))a.third=bl.map(b=>b[1]);
  const hasBank=(a,bank)=>(BB.get(a)||[]).some(b=>b[1]===bank);
  const lastAct=(d,day,f)=>{let best=null;for(const a of d.acts){if(a.ap>day)break;if(f(a))best=a}return best};
  // 입금 — 법조치키가 없으면 그 전 마지막 압류(같은 은행 먼저)·경매로 이음
  const PK=T.PK||PAYK,PB=T.PB||[];
  for(const r of T.P){if(r[1]>TODAY)continue;const d=Ds[r[0]],kind=PK[r[3]]||'기타';let bank=r[4]>=0?PB[r[4]]:'',act=r[5]>=0?Ls[r[5]]:null;
    if(!act&&(kind==='추심금'||kind==='공탁금'))act=(bank&&lastAct(d,r[1],a=>a.g==='압류추심'&&hasBank(a,bank)))||lastAct(d,r[1],a=>a.g==='압류추심');
    if(!act&&kind==='배당금')act=lastAct(d,r[1],a=>a.g==='경매')||lastAct(d,r[1],a=>a.g==='압류추심');
    if(kind==='추심금'&&!bank&&act&&(BB.get(act)||[]).length===1)bank=BB.get(act)[0][1];
    d.pays.push({d,day:r[1],amt:r[2],kind,act,bank})}
  // 전자추심 — 법조치키가 없으면 그 전 마지막 예금·증권 압류(같은 은행 먼저)
  for(const r of T.E){const d=Ds[r[1]],bank=r[2];let a=r[0]>=0?Ls[r[0]]:null;
    if(!a)a=lastAct(d,r[3],x=>BANKT.includes(x.t)&&hasBank(x,bank))||lastAct(d,r[3],x=>x.g==='압류추심');
    if(!a)continue;const e={a,d,bank,day:r[3],amt:r[4]};d.ecol.push(e);ECOL.push(e)}
  // 약정 — 송달 뒤 연계 기간 안에 맺은 약정은 그 법조치가 이끈 것으로
  for(const r of T.C){const d=Ds[r[0]],day=r[2],a=lastAct(d,day,x=>x.res==='인용'&&x.sv<=day&&day-x.sv<=S.conN),n=r[4]||0;
    d.cons.push({d,day,kind:'약정',cat:r[1],act:a,n,amt:r[5]||(n&&r[6]?Math.round(r[6]/n):0),kept:0,start:r[3]!=null?r[3]:day+10,res:`${r[1]}${n?' '+n+'회':''}`,state:r[7]||''})}
  for(const r of T.R){const a=Ls[r[0]],x={a,d:a.d,day:r[2],text:r[3]||'',cat:r[4]||relCat(r[3]||''),bank:r[5]||''};if(!a.rel||a.rel.day<x.day)a.rel=x;a.d.rels.push(x);REL.push(x)}
  for(const d of Ds){
    d.cons.sort((x,y)=>x.day-y.day);if(d.cons.length)d.agree=d.cons[d.cons.length-1];CON.push(...d.cons);
    d.pays.sort((x,y)=>x.day-y.day);
    for(const p of d.pays){if(p.kind==='약정분납'){let ag=null;for(const c of d.cons)if(c.day<=p.day)ag=c;if(ag){ag.kept++;if(!p.act)p.act=ag.act}}
      PAY.push(p);const k=Math.floor((p.day-W0)/7);if(k>=0&&k<NW)d.pw[k]+=p.amt}
    d.bal=d.accts.reduce((x,a)=>x+a.bal,0);
    // 은행별 줄: 결정금액 · 추심 요청 · 추심금
    for(const a of d.acts){ACT.push(a);
      if(!BANKT.includes(a.t)||a.res!=='인용')continue;const bl=BB.get(a);if(!bl||!bl.length)continue;
      const c={id:a.id,key:d.key,name:d.name,owner:d.owner,no:a.no,d0:a.ap,claim:0,age:d.age,sex:d.sex,pf:d.pf,nb:bl.length,rows:[],last:0,sub:a.s,act:a,d,sihyo:Math.min(...d.accts.map(x=>x.sihyo))};
      for(const b of bl){const bank=b[1],h=d.hist[bank],ev=h?(h.paid?'paid':'prev'):'none';
        let paid=0,paidDay=null;for(const p of d.pays)if(p.act===a&&p.kind==='추심금'&&p.bank===bank){paid+=p.amt;if(paidDay==null)paidDay=p.day}
        let q=null;for(const e of d.ecol)if(e.a===a&&e.bank===bank&&(!q||e.day<q.day))q=e;
        const r={c,bank,ev,alloc:b[2],served:true,responded:!!q,account:paid>0,rec:paid,paid,paidDay,respDay:a.cite+10,req:!!q,reqDay:q?q.day:null,why:paid>0||q?'':'추심 요청 없음'};
        c.claim+=b[2];c.rows.push(r);ALL_ROWS.push(r);c.last=Math.max(c.last,r.respDay);a.banks.push(r);
        d.hist[bank]={paid:(h&&h.paid)||paid>0,day:paidDay||(q&&q.day)||a.cite}}
      ALL_CASES.push(c)}
    const ref=d.acts.length?d.acts[0].ap:TODAY;
    d.prior=d.pays.some(p=>(p.kind==='본인변제'||p.kind==='약정분납')&&p.day<ref&&p.day>=ref-365);
    const tc=d.acts.filter(a=>a.conf!=null&&(a.g==='지급명령'||a.g==='소송'));if(tc.length){const f=tc.reduce((x,y)=>y.conf<x.conf?y:x);d.title0={day:f.conf,t:f.t}}
    d.st=(d.prior?10:0)+BANDS.indexOf(band(d.bal))+(d.title0?5:0);
    d.hasJob=d.acts.some(a=>a.t==='급여 압류추심'&&d.pays.some(p=>p.act===a));d.hasProp=d.acts.some(a=>a.g==='경매');
    DEBT.push(d)}
  for(const x of (T.X||[])){const d=Ds[x[0]];if(d)(d.adj=d.adj||[]).push({kind:x[1],ap:x[2],st:x[3],day:x[4],src:x[5]||''})}
  const cnt=(arr,f)=>{const m=new Map();for(const x of arr){const k=f(x);if(k)m.set(k,(m.get(k)||0)+1)}return [...m].sort((a,b)=>b[1]-a[1]).map(x=>x[0])};
  OWNERS=cnt(DEBT,d=>d.owner);PFS=cnt(DEBT,d=>d.pf);BN=cnt(ALL_ROWS,r=>r.bank);
  LTN=TYPE_ORDER.filter(t=>ACT.some(a=>a.t===t));if(!LTN.length)LTN=['지급명령'];
  if(DEBT.some(d=>d.age==='모름')&&!AGES.includes('모름'))AGES.push('모름');
  CASES=ALL_CASES;ROWS=ALL_ROWS}

function setBootMsg(t){const v=document.getElementById('view');if(v)v.innerHTML=`<div class="boot"><span class="spin"></span>${t}</div>`}
const tick=()=>new Promise(r=>setTimeout(r,30));
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),Math.max(2200,String(t).length*75))}
function modeChip(){return DATA_MODE==='real'?`<span class="chip sm">자료 기준일 ${ds(TODAY)}</span>`:'<span class="chip demo sm">예시 자료</span>'}
async function loadReal(){let s='',i=0,n=1;while(i<n){const r=await apiP('rc_load',{i});if(!r)return null;n=r.n;s+=r.s;i++;if(n>1)setBootMsg(`넣은 자료 불러오는 중… ${Math.round(i/n*100)}%`)}return JSON.parse(s)}
function flushAsk(){const l=BOOT_ASK;BOOT_ASK=[];if(!l.length)return;const sm=APP_ON&&typeof rcSummary==='function'?rcSummary():{empty:true,mode:'empty',miss:0,ready:0,check:0,next:0};l.forEach(w=>{try{w.postMessage({rcSummary:sm},'*')}catch(e){}})}
async function boot(){
  let T=null,state=null;
  if(HAS_API){try{DATA_META=await apiP('rc_info');if(DATA_META.has){setBootMsg('넣은 자료 불러오는 중…');T=await loadReal();if(T)DATA_MODE='real';
      if(T){try{const rh=await apiP('rc_rehab');if(rh&&rh.length){const ix=new Map(T.D.map((d,i)=>[String(d[0]),i]));T.X=T.X||[];const have=new Set(T.X.map(x=>x[0]+'|'+x[1]+'|'+x[3]));
        for(const [k,kind,day] of rh){const i=ix.get(String(k)),dn=Math.floor(Date.parse(day)/DAY);if(i==null||isNaN(dn)||have.has(i+'|'+kind+'|폐지'))continue;T.X.push([i,kind,null,'폐지',dn,'rehab'])}}}catch(e){}}}}
    catch(e){console.error(e);toast('넣은 자료를 읽지 못했어요: '+(e.message||e))}}
  if(!T){let want=!HAS_API||!!(DATA_META&&DATA_META.demo);try{want=want||sessionStorage.getItem(RC_DEMO_KEY)==='1'}catch(e){}
    if(!want){DATA_MODE='empty';BOOTED=true;renderEmpty();flushAsk();return}
    DATA_MODE='demo';setBootMsg('예시 자료 만드는 중…');await tick();T=DEMO_T=augmentDemo(genDemo(40000))}
  if(HAS_API){try{state=await apiP('rc_state',{demo:DATA_MODE==='demo'})}catch(e){}}
  if(state&&state.S)for(const [k,v] of Object.entries(state.S))if(k in S)S[k]=v;
  setBootMsg('계산하는 중…');await tick();
  build(T);T=null;window.__rcState=state;
  const sc=document.createElement('script');sc.textContent=document.getElementById('appCode').textContent;document.body.appendChild(sc)}
window.addEventListener('message',e=>{const d=e.data||{};
  if(d.rcDrop){if(APP_ON&&ST.view!=='data')go('data');impOpen(d.rcDrop);return}
  if(APP_ON)return;  // 화면이 뜬 뒤에는 아래(뒤 스크립트)에서 받음
  if(d.rcGo)BOOT_WANT=d.rcGo;

/* ── 자료 넣기: ① 파일 고르기 → ② 칸 맞추기 → ③ 값 맞추기 → ④ 담아 두기 → 점검표 → 넣기 ──
   채권마다 원자료 칸 이름·값이 달라도 프로그램이 먼저 맞춰 보고, 사람은 틀린 것만 고르면 됨. 맞춘 것은 채권마다 기억. */
const IMP={step:'pick',path:'',open:null,cur:0,sel:{},vals:{},vmap:{},busy:'',err:'',staged:null};
const LVC={'오류':'red','주의':'warn','정보':''};
function reView(){if(!APP_ON)renderEmpty();else render()}
const impErr=e=>{IMP.busy='';IMP.err=e.message||String(e);reView()};
async function impPick(){if(!HAS_API){toast('종합관리 안에서 넣을 수 있어요');return}try{const p=await parent.chooseExcel();if(p)impOpen(p)}catch(e){toast(e.message||String(e))}}
async function impOpen(p){Object.assign(IMP,{step:'pick',path:p,open:null,cur:0,sel:{},vals:{},vmap:{},err:'',busy:'파일 읽는 중… 큰 파일은 30초쯤 걸려요'});reView();
  try{const o=await apiP('rc_raw_open',{path:p});IMP.open=o;o.sheets.forEach(x=>{IMP.sel[x.name]={kind:x.kind||'',cols:{...x.cols},how:x.saved?'saved':x.kind?'auto':''}});
    if(!o.sheets.length)throw new Error('읽을 수 있는 시트가 없어요');IMP.cur=o.sheets.findIndex(x=>IMP.sel[x.name].kind)||0;if(IMP.cur<0)IMP.cur=0;
    IMP.step='map';IMP.busy='';reView()}catch(e){impErr(e)}}
const impKind=k=>(IMP.open.kinds||[]).find(x=>x.id===k);
function impMissing(name){const s=IMP.sel[name];if(!s||!s.kind)return[];return impKind(s.kind).fields.filter(f=>f.req&&(s.cols[f.f]==null||s.cols[f.f]===-1)).map(f=>f.f)}
function impSetKind(name,k){const sh=IMP.open.sheets.find(x=>x.name===name);IMP.sel[name]={kind:k,cols:{},how:'own'};
  if(k){const H=sh.header;impKind(k).fields.forEach(f=>{const i=H.findIndex(h=>h.replace(/\s/g,'')===f.f);if(i>=0)IMP.sel[name].cols[f.f]=i})}reView()}
function impSetCol(name,f,v){const s=IMP.sel[name];if(v==='')delete s.cols[f];else s.cols[f]=+v;s.how='own';reView()}
async function impToValues(){const use=IMP.open.sheets.filter(x=>IMP.sel[x.name].kind);
  if(!use.length){IMP.err='넣을 시트가 없어요 — 「무슨 자료인지」를 골라 주세요';reView();return}
  const bad=use.filter(x=>impMissing(x.name).length);if(bad.length){IMP.cur=IMP.open.sheets.indexOf(bad[0]);IMP.err=`「${bad[0].name}」 시트의 꼭 필요한 칸을 골라 주세요: ${impMissing(bad[0].name).join(', ')}`;reView();return}
  IMP.err='';IMP.busy='값을 모으는 중…';reView();
  try{for(const x of use){const s=IMP.sel[x.name];IMP.vals[x.name]=await apiP('rc_raw_values',{path:IMP.path,sheet:x.name,kind:s.kind,cols:s.cols});
      IMP.vmap[x.name]={};IMP.vals[x.name].forEach(fl=>{IMP.vmap[x.name][fl.field]=Object.fromEntries(fl.values.map(v=>[v.raw,v.code]))})}
    IMP.busy='';const need=use.some(x=>(IMP.vals[x.name]||[]).length);if(need){IMP.step='values';reView()}else impStage()}catch(e){impErr(e)}}
async function impStage(){const use=IMP.open.sheets.filter(x=>IMP.sel[x.name].kind);IMP.busy='담는 중… 점검표도 만들어요';reView();
  try{const r=await apiP('rc_raw_stage',{path:IMP.path,items:use.map(x=>({sheet:x.name,kind:IMP.sel[x.name].kind,cols:IMP.sel[x.name].cols,values:IMP.vmap[x.name]||{}}))});
    IMP.staged=r;Object.assign(IMP,{step:'pick',path:'',open:null,busy:'',err:''});toast(`담았어요 — ${r.done.map(d=>d.name+' '+d.rows.toLocaleString()+'줄').join(' · ')}`);reView()}catch(e){impErr(e)}}
async function impStagedLoad(){if(!HAS_API)return;try{IMP.staged=await apiP('rc_staged');reView()}catch(e){}}
async function impUnstage(k){if(!confirm('담아 둔 이 자료를 뺄까요? (넣은 자료는 그대로예요)'))return;try{IMP.staged=await apiP('rc_unstage',{kind:k});reView()}catch(e){toast(e.message||String(e))}}

async function impReport(){try{const p=await apiP('rc_staged_report');toast('점검표 저장: '+p.split(/[\\/]/).pop());apiP('reveal',{path:p}).catch(()=>{})}catch(e){toast(e.message||String(e))}}
async function impClear(){if(!confirm('넣은 자료를 지울까요?\n지운 자료는 채권 폴더 recovery/backup 에 남아요.'))return;try{await apiP('rc_clear');location.reload()}catch(e){toast(e.message||String(e))}}
async function impForget(){if(!confirm('기억해 둔 칸·값 맞추기를 모두 지울까요? 다음부터 처음처럼 자동 제안부터 시작해요.'))return;try{await apiP('rc_forget');toast('지웠어요')}catch(e){toast(e.message||String(e))}}
const impSteps=n=>`<div class="isteps">${['파일 고르기','칸 맞추기','값 맞추기','담아 두기'].map((t,i)=>`<span class="${i+1<n?'done':i+1===n?'on':''}"><i>${i+1<n?'✓':i+1}</i>${t}</span>`).join('<b></b>')}</div>`;
const HOWT={saved:['tag ok','지난번대로'],auto:['tag acc','자동으로 찾음'],same:['tag','그대로'],own:['tag','직접 고름'],'':['tag red','못 찾음']};
function impMapCard(){const o=IMP.open,shs=o.sheets,x=shs[IMP.cur],s=IMP.sel[x.name],K=s.kind?impKind(s.kind):null,H=x.header;
  const col=i=>i==null||i<0?'':H[i]||`(${i+1}번째 칸)`,ex=i=>i==null||i<0?'':x.sample.map(r=>r[i]).filter(v=>v!==''&&v!=null).slice(0,3).map(v=>hx(v)).join(' · ');
  const tabs=shs.length>1?`<div class="itabs">${shs.map((y,i)=>{const t=IMP.sel[y.name],m=impMissing(y.name);return `<button class="${i===IMP.cur?'on':''}" onclick="IMP.cur=${i};reView()"><b>${hx(y.name)}</b><span>${t.kind?hx(impKind(t.kind).name):'넣지 않음'}</span>${t.kind?(m.length?'<em class="bad">칸 '+m.length+'개 필요</em>':'<em class="ok">✓</em>'):''}</button>`}).join('')}</div>`:'';
  const rows=K?K.fields.map(f=>{const i=s.cols[f.f],miss=f.req&&(i==null||i<0);return `<tr class="${miss?'imiss':''}"><td><b>${f.f}</b> ${f.req?'<span class="tag red sm">꼭</span>':'<span class="sub">있으면</span>'}${f.codes?' <span class="tag sm">값 맞추기</span>':''}</td>
     <td><select onchange="impSetCol(${JSON.stringify(x.name).replace(/"/g,'&quot;')},'${f.f}',this.value)"><option value="">— 없음 —</option>${H.map((h,j)=>`<option value="${j}" ${i===j?'selected':''}>${hx(h||'('+(j+1)+'번째 칸)')}</option>`).join('')}</select></td>
     <td class="sub">${ex(i)||(miss?'<span class="bad">원자료에서 이 칸을 골라 주세요</span>':'')}</td></tr>`}).join(''):'';
  return `<div class="card"><div class="ch"><h3>② 칸 맞추기</h3><span class="sub">${hx(o.file)}${o.template?' · 공통 양식':''}</span><div class="r"><button class="btn sm" onclick="IMP.step='pick';IMP.open=null;reView()">다른 파일</button></div></div>
   <div class="cb">${impSteps(2)}${tabs}
    <div class="row" style="gap:10px;margin:4px 0 12px"><b>시트 「${hx(x.name)}」</b><span class="sub">${x.rows.toLocaleString()}줄${x.hi?` · 머리글 ${x.hi+1}번째 줄`:''}</span><span style="flex:1"></span>
     <span class="sub">무슨 자료인가요?</span><select onchange="impSetKind(${JSON.stringify(x.name).replace(/"/g,'&quot;')},this.value)"><option value="">넣지 않음</option>${o.kinds.map(k=>`<option value="${k.id}" ${s.kind===k.id?'selected':''}>${k.id.slice(0,2)} ${hx(k.name)}</option>`).join('')}</select>
     ${s.kind?`<span class="${HOWT[s.how][0]}">${HOWT[s.how][1]}</span>`:''}</div>
    ${s.how==='saved'?'<div class="note ok" style="margin-bottom:10px">이 채권의 지난번 파일과 머리글이 같아서 그때 맞춘 대로 채웠어요. 바뀐 게 없으면 그대로 다음으로 가면 돼요.</div>':s.how==='auto'?'<div class="note" style="margin-bottom:10px">칸 이름을 보고 먼저 맞춰 봤어요. <b>예시 값</b>을 보고 틀린 것만 고쳐 주세요. 한 번 맞추면 다음 달 같은 모양 파일은 저절로 채워져요.</div>':''}
   </div>
   ${K?`<div class="tw" style="max-height:420px"><table class="xl"><thead><tr><th style="width:34%">공통 양식 칸</th><th style="width:30%">원자료 칸</th><th>예시 값 (원자료 앞 줄)</th></tr></thead><tbody>${rows}</tbody></table></div>`:'<div class="cb sub">이 시트는 넣지 않아요. 넣으려면 「무슨 자료인가요?」에서 골라 주세요.</div>'}
   <details class="cb"><summary class="sub" style="cursor:pointer">원자료 앞 줄 보기</summary><div class="tw" style="max-height:240px;margin-top:8px"><table class="xl"><thead><tr>${H.map(h=>`<th>${hx(h)}</th>`).join('')}</tr></thead><tbody>${x.sample.map(r=>`<tr>${H.map((_,j)=>`<td class="nw">${hx(r[j]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>
   <div class="cb">${IMP.err?`<div class="note bad" style="margin-bottom:10px">${hx(IMP.err)}</div>`:''}<div class="row"><span class="sub">시트 ${shs.filter(y=>IMP.sel[y.name].kind).length}개를 넣어요</span><span style="flex:1"></span><button class="btn p" onclick="impToValues()">다음: 값 맞추기 →</button></div></div></div>`}
function impValuesCard(){const use=IMP.open.sheets.filter(x=>IMP.sel[x.name].kind&&(IMP.vals[x.name]||[]).length);
  const blocks=use.map(x=>IMP.vals[x.name].map(fl=>{const mp=IMP.vmap[x.name][fl.field],unk=fl.values.filter(v=>!v.how).length;
    return `<div class="ival"><div class="row" style="margin-bottom:6px"><b>${hx(x.name)} › ${fl.field}</b><span class="sub">원문 ${fl.values.length}가지${fl.more?` (+${fl.more}가지 더는 규칙대로)`:''}</span>${unk?`<span class="tag red">못 찾음 ${unk}</span>`:'<span class="tag ok">다 맞춤</span>'}</div>
     <div class="tw" style="max-height:300px"><table class="xl"><thead><tr><th>원자료 값</th><th class="n">건수</th><th style="width:200px">→ 공통 양식 값</th><th>어떻게</th></tr></thead><tbody>
     ${fl.values.map(v=>`<tr class="${!v.how?'imiss':''}"><td>${hx(v.raw)}</td><td class="n">${v.n.toLocaleString()}</td><td><select onchange="IMP.vmap[${JSON.stringify(x.name).replace(/"/g,'&quot;')}]['${fl.field}'][${JSON.stringify(v.raw).replace(/"/g,'&quot;')}]=this.value;this.closest('tr').classList.remove('imiss')">${fl.codes.map(c=>`<option ${mp[v.raw]===c?'selected':''}>${c}</option>`).join('')}</select></td><td><span class="${HOWT[v.how][0]}">${v.how?HOWT[v.how][1]:'기본값으로 둠 · 골라 주세요'}</span></td></tr>`).join('')}</tbody></table></div></div>`}).join('')).join('');
  return `<div class="card"><div class="ch"><h3>③ 값 맞추기</h3><span class="sub">구분 값이 채권마다 달라요 — 공통 양식 값으로 바꿔 넣어요</span><div class="r"><button class="btn sm" onclick="IMP.step='map';reView()">← 칸 맞추기</button></div></div>
   <div class="cb">${impSteps(3)}<div class="note" style="margin-bottom:12px">낱말을 보고 먼저 맞춰 봤어요(예: 가상계좌입금 → 본인변제, 채권압류및추심명령 → 압류추심). <span class="tag red">못 찾음</span>만 골라 주면 돼요. 고른 것은 기억해서 다음 파일부터 저절로 맞춰요.</div>${blocks}
   ${IMP.err?`<div class="note bad" style="margin:10px 0">${hx(IMP.err)}</div>`:''}<div class="row" style="margin-top:12px"><span style="flex:1"></span><button class="btn p" onclick="impStage()">④ 담아 두기</button></div></div></div>`}
function impPickCard(){return `<div class="card"><div class="ch"><h3>새 자료 넣기</h3><span class="sub">원자료 그대로 · 공통 양식 모두 돼요</span></div><div class="cb">${impSteps(1)}
  ${IMP.err?`<div class="note bad" style="margin-bottom:10px">${hx(IMP.err)}</div>`:''}
  <div class="drop imp-drop"><b>전산에서 뽑은 파일을 이 화면에 끌어다 놓기</b>또는 <button class="btn p sm" onclick="impPick()">파일 고르기</button>
  <div class="sub" style="margin-top:8px">.xlsx · .xls · .csv — 시트가 여러 개면 시트마다 무슨 자료인지 알아서 찾아요. 칸 이름이 달라도 돼요.</div></div>
  <div class="sub" style="margin-top:10px">파일마다 <b>채권 목록 · 법조치 · 제3채무자 · 입금 · 조정 · 해제 · 전자추심 · 채무조정</b> 중 하나씩(또는 여러 시트) 담아 두고, 다 담으면 오른쪽 「담아 둔 자료」에서 한꺼번에 넣어요. <a class="hl" onclick="impForget()">기억한 칸·값 맞추기 지우기</a></div></div></div>`}
function impPanel(){if(IMP.busy)return `<div class="card"><div class="ch"><h3>새 자료 넣기</h3></div><div class="imp-busy"><span class="spin"></span>${IMP.busy}</div></div>`;
  return IMP.step==='map'&&IMP.open?impMapCard():IMP.step==='values'&&IMP.open?impValuesCard():impPickCard()}
function stagedCard(){const S2=IMP.staged;if(!S2)return `<div class="card"><div class="ch"><h3>담아 둔 자료</h3></div><div class="cb sub">불러오는 중…</div></div>`;
  const R=S2.report,ks=S2.kinds,need=ks.filter(k=>k.need&&!k.n);
  const items=R?R.items||[]:[];
  return `<div class="card"><div class="ch"><h3>담아 둔 자료</h3><span class="sub">넣기 전 대기 칸 — 넣어야 분석에 써요</span>${R?`<div class="r"><span class="tag ${R.errors?'red':'ok'}">오류 ${R.errors.toLocaleString()}</span><span class="tag ${R.warns?'warn':'ok'}">주의 ${R.warns.toLocaleString()}</span></div>`:''}</div>
   <div class="cb flush"><div class="tw"><table class="xl"><thead><tr><th>자료</th><th>파일 · 시트</th><th class="n">줄</th><th>담은 때</th><th></th></tr></thead><tbody>
   ${ks.map(k=>`<tr><td class="nw"><b>${k.kind.slice(0,2)}</b> ${hx(k.name.split(' (')[0])} ${k.need?'<span class="tag red sm">꼭</span>':''}</td><td>${k.n?`${hx(k.file)} <span class="sub">› ${hx(k.sheet||'')}</span>`:'<span class="sub">아직 없음</span>'}</td><td class="n">${k.n?k.n.toLocaleString():''}</td><td class="nw sub">${(k.at||'').slice(5)}</td><td class="nw">${k.n?`<a class="hl" onclick="impUnstage('${k.kind}')">빼기</a>`:''}</td></tr>`).join('')}</tbody></table></div></div>
   ${R?`<details class="cb" ${R.errors||R.warns?'open':''}><summary style="cursor:pointer"><b>점검표</b> <span class="sub">자료 기준일 ${hx(R.asof)} · ${Object.entries(R.counts||{}).filter(([,v])=>v).map(([k,v])=>k+' '+v.toLocaleString()).join(' · ')}</span></summary>
     <div class="tw" style="max-height:360px;margin-top:8px"><table class="xl"><thead><tr><th style="width:64px">구분</th><th style="width:96px">시트</th><th style="min-width:200px">내용</th><th class="n" style="width:64px">건수</th><th style="width:110px">줄 번호</th></tr></thead><tbody>
     ${items.map(x=>`<tr><td><span class="tag ${LVC[x.level]}">${x.level}</span></td><td class="nw">${hx(x.sheet)}</td><td>${hx(x.what)}${x.sample&&x.sample.length?`<div class="sub">예: ${x.sample.map(hx).join(' · ')}</div>`:''}</td><td class="n">${x.level==='정보'&&!x.rows.length?'–':x.n.toLocaleString()}</td><td class="sub">${x.rows.join(', ')}${x.n>x.rows.length&&x.rows.length?' …':''}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">걸린 것 없음</td></tr>'}</tbody></table></div></details>`:''}
   <div class="cb">${need.length?`<div class="note" style="margin-bottom:10px"><b>${need.map(k=>k.name).join(' · ')}</b>을 담아야 넣을 수 있어요.</div>`:'<div class="note" style="margin-bottom:10px">넣으면 지금 분석 자료를 <b>담아 둔 자료로 바꿔요</b>. 오류 줄은 빼고 넣고, 압류 판단·처리 기록은 채무자키·법조치키로 이어져 남아요. 바꾸기 전 자료는 recovery/backup 에 남아요.</div>'}
   <div class="row"><button class="btn" ${R?'':'disabled'} onclick="impReport()">점검표 엑셀</button><span style="flex:1"></span><button class="btn p" ${R&&R.ok?'':'disabled'} onclick="impApply()">이대로 넣기</button></div></div></div>`}

  const dm=document.getElementById('dmode');if(dm)dm.textContent='넣은 자료 없음';
  if(!IMP.staged&&HAS_API&&!IMP._sl){IMP._sl=1;impStagedLoad()}
  v.innerHTML=`<div class="ph"><div>${EMBED?'<div class="crumb">회수 분석</div>':''}<h1>회수 자료 넣기</h1><p>아직 넣은 자료가 없어요. 전산에서 뽑은 원자료를 그대로 넣으면 칸·값을 맞춰 회수 현황·놓친 것·압류 판단·법조치 계획·통계를 계산해요.</p></div><div class="row"><button class="btn" onclick="dlTemplate()">공통 양식 받기</button></div></div>
  <div class="gside" style="grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)"><div class="stack">${impPanel()}</div>
   <div class="stack">${stagedCard()}<div class="card"><div class="ch"><h3>먼저 둘러보기</h3></div><div class="cb"><p class="sub" style="margin:0 0 12px">가짜 채무자 4만 명 예시 자료로 모든 화면을 볼 수 있어요. 예시 자료로 한 판단·처리는 실제 기록과 따로 저장돼요.</p>
   <button class="btn" onclick="try{sessionStorage.setItem(RC_DEMO_KEY,'1')}catch(e){}location.reload()">예시 자료로 둘러보기</button></div></div></div></div>`}

const won=v=>v==null||isNaN(v)?'–':Math.round(v).toLocaleString()+'원';
const man=v=>{if(v==null||isNaN(v))return'–';const a=Math.abs(v);if(a>=1e8)return(v/1e8).toFixed(2)+'억';return Math.round(v/1e4).toLocaleString()+'만'};
const pct=(p,d=1)=>p==null||isNaN(p)?'–':(p*100).toFixed(d)+'%';
function wilson(x,n,z=1.96){if(!n)return[0,1];const p=x/n,d=1+z*z/n,c=p+z*z/(2*n),m=z*Math.sqrt(Math.max(0,p*(1-p)/n+z*z/(4*n*n)));return[Math.max(0,(c-m)/d),Math.min(1,(c+m)/d)]}
const settledRow=r=>r.respDay<=TODAY-S.wait;
const settledCase=c=>c.last<=TODAY-S.wait;
const rowCost=r=>(S.stamp+S.post*S.times*2)/r.c.nb+S.post*S.times+S.per;
const caseCost=c=>c.rows.reduce((a,r)=>a+rowCost(r),0);
const casePaid=c=>c.rows.reduce((a,r)=>a+r.paid,0);
function aggRows(rows){
  const a={n:rows.length,served:0,resp:0,acct:0,money:0,paid:0,amt:0,days:0,sS:0,sP:0,sAmt:0,sCost:0};
  for(const r of rows){
    if(r.served)a.served++;if(r.responded)a.resp++;if(r.account)a.acct++;if(r.rec>0)a.money++;
    if(r.paid>0){a.paid++;a.amt+=r.paid;a.days+=r.paidDay-r.respDay}
    if(settledRow(r)&&r.served){a.sS++;if(r.paid>0)a.sP++;a.sAmt+=r.paid;a.sCost+=rowCost(r)}
  }
  a.rate=a.sS?a.sP/a.sS:null;a.ci=wilson(a.sP,a.sS);a.avg=a.paid?a.amt/a.paid:null;a.dd=a.paid?a.days/a.paid:null;
  a.net=a.sS?(a.sAmt-a.sCost)/a.sS:null;return a;

  }

}

let BIX=null,BIXV=-1;
function bankIndex(){
  if(BIXV===ST.ver)return BIX;const m=new Map();
  const add=(k,r)=>{let x=m.get(k);if(!x){x={nN:0,xN:0,nO:0,xO:0,an:[],aa:[]};m.set(k,x)}
    if(r.c.d0>=LAW){x.nN++;if(r.paid>0)x.xN++}else{x.nO++;if(r.paid>0)x.xO++}if(r.paid>0){x.aa.push(r.rec);if(r.c.d0>=LAW)x.an.push(r.rec)}};
  for(const r of ALL_ROWS){if(!r.served||!settledRow(r))continue;add(r.bank+'|all',r);add(r.bank+'|ev:'+r.ev,r);add('*|ev:'+r.ev,r);add(r.bank+'|band:'+band(r.c.claim),r)}
  const pre=a=>{a.sort((x,y)=>x-y);const p=new Float64Array(a.length+1);for(let i=0;i<a.length;i++)p[i+1]=p[i]+a[i];return p};
  for(const x of m.values()){x.pn=pre(x.an);x.pa=pre(x.aa)}
  BIX=m;BIXV=ST.ver;return m;
}
function blendX(x){
  if(!x)return{x:0,n:0,nn:0,no:0,xn:0,xo:0,mixed:false};
  if(x.nN>=S.minN||!x.nO)return{x:x.xN,n:x.nN,nn:x.nN,no:0,xn:x.xN,xo:0,mixed:false};
  const k=S.oldW/100;return{x:x.xN+k*x.xO,n:x.nN+k*x.nO,nn:x.nN,no:x.nO,xn:x.xN,xo:x.xO,mixed:true};
}
const bankRate=b=>{const g=blendX(bankIndex().get(b+'|all'));return g.n?g.x/g.n:0};
function estimate(p,b){
  const I=bankIndex(),ev=p.evs.find(e=>e.bank===b),bd=band(p.claim);
  const G=I.get(ev?b+'|ev:'+ev.type:b+'|band:'+bd),P=I.get(ev?'*|ev:'+ev.type:b+'|all'),B=I.get(b+'|all');

  const g=blendX(G),pp=blendX(P),p0=pp.n?pp.x/pp.n:0,m=S.shrink;
  const pr=(g.x+m*p0)/(g.n+m),ci=wilson(g.x,g.n);

function expAmt(e,al){const a=e.amts,n=a.length;if(!n)return 0;let lo=0,hi=n;while(lo<hi){const md=(lo+hi)>>1;if(a[md]<al)lo=md+1;else hi=md}return(e.ps[lo]+al*(n-lo))/n}
const meanAmt=e=>e.amts.length?e.ps[e.amts.length]/e.amts.length:0;
function allocate(p,set,mode,E){
  const out={};if(!set.length)return out;
  if(mode==='manual'){for(const b of set)out[b]=ST.manual[b]??Math.floor(p.claim/set.length/1e4)*1e4;return out}
  const w=set.map(b=>mode==='eq'?1:E[b].p*meanAmt(E[b]));
  const sw=w.reduce((a,b)=>a+b,0)||1;let used=0;
  set.forEach((b,i)=>{out[b]=Math.floor(p.claim*w[i]/sw/1e4)*1e4;used+=out[b]});
  out[set[w.indexOf(Math.max(...w))]]+=p.claim-used;return out;

  return{al,exp,cost,net:exp-cost,netLo:lo-cost,netHi:hi-cost,sum:Object.values(al).reduce((a,b)=>a+b,0)};

const GORD={ready:0,check:1,low:2,block:3};
function caseList(){return openP().sort((a,b)=>(GORD[group(a)]-GORD[group(b)])||(res(b).rc.r.net-res(a).rc.r.net))}

function reasons(p,R0){
  if(R0.blocked)return '<div class="sub">집행이 막혀 은행을 추천하지 않았습니다.</div>';
  const E=R0.E,rc=R0.rc,al=rc.r.al;
  const inn=rc.set.map(b=>{const e=E[b],a=expAmt(e,al[b]),grp=e.src.split(' 중 ')[1];
    return `<li class="ok"><i>✓</i><span><b>${b}</b> — ${grp} 중 <b>${pct(e.p,0)}</b>가 입금, 입금되면 평균 ${man(a)} → 기대 ${man(e.p*a)}가 추가 비용 ${man(e.cost)}보다 큼</span></li>`}).join('');
  const out=BN.filter(b=>!rc.set.includes(b)&&!E[b].ongoing).map(b=>({b,e:E[b],m:evaluate(p,[...rc.set,b],'prop',E).net-rc.r.net})).sort((x,y)=>y.m-x.m).slice(0,2);
  const outs=out.map(x=>`<li class="warn"><i>–</i><span><b>${x.b}</b> — ${x.e.few?`이 은행 기록이 ${Math.round(x.e.g.n)}건뿐이라 추천에서 뺌 (직접 고를 수는 있음)`:x.m>0?`최대 ${S.maxB}곳까지만 추천해서 뺌 (넣으면 +${man(x.m)})`:`넣으면 기대 순회수 −${man(Math.abs(x.m))} · 입금 가능성 ${pct(x.e.p,0)}로는 추가 비용 ${man(x.e.cost)}을 못 넘김`}</span></li>`).join('');
  return `<ul class="chk">${inn||'<li class="warn"><i>–</i><span>기대 순회수가 0보다 큰 은행이 없습니다.</span></li>'}${outs}</ul>`;
}

function planCands(){
  const out=new Map();
  for(const p of openP()){const r=res(p);if(r.blocked||!r.rc.set.length||r.rc.r.net<S.minGain)continue;const warn=p.flags.some(f=>f[0]==='warn');if(warn&&!ST.pWarn)continue;
    out.set(p.key,{key:p.key,name:p.name,owner:p.owner,t:'예금 압류추심',src:'압류 판단',cost:r.rc.r.cost,gain:r.rc.r.exp,net:r.rc.r.net,warn,note:`은행 ${r.rc.set.length}곳`})}
  // 예금·증권 압류추심은 은행까지 정한 「압류 판단」 안만 씀 (두 계산이 섞이지 않게)
  for(const x of recs()){if(!x.best||x.best.avg<S.minGain||BANKT.includes(x.best.t))continue;const k=x.d.key,cost=LTYPES[x.best.t].cost,c={key:k,name:x.d.name,owner:x.d.owner,t:x.best.t,src:'다음 법조치',cost,gain:x.best.avg+cost,net:x.best.avg,warn:false,note:`${x.last.t} 뒤`};
    if(!out.has(k))out.set(k,c)}  // 압류 판단에 올라온 채무자는 은행까지 정한 그 안을 그대로 씀
  return [...out.values()].sort((a,b)=>b.net/b.cost-a.net/a.cost);
}
function makePlan(C,budget,cap){const used={},pick=[];let cost=0;for(const c of C){if(cost+c.cost>budget)continue;if((used[c.owner]||0)>=cap)continue;used[c.owner]=(used[c.owner]||0)+1;cost+=c.cost;pick.push(c)}
  return{pick,cost,gain:pick.reduce((a,c)=>a+c.gain,0),net:pick.reduce((a,c)=>a+c.net,0),used,last:pick[pick.length-1]}}

function attr(p){

  if(p.kind==='약정분납'&&p.act)return[{a:p.act,share:1,kind:'연계'}];
  const ws=p.d.acts.filter(a=>a.res==='인용'&&p.day>=a.sv&&p.day<a.sv+S.conN);
  if(!ws.length)return[];
  if(ST.touch==='split')return ws.map(a=>({a,share:1/ws.length,kind:'연계'}));
  return[{a:ws.reduce((x,y)=>y.sv>x.sv?y:x),share:1,kind:'연계'}];
}
/* ─── 비교 집단: 아직 법조치를 한 번도 안 받은 비슷한 채무자(잔액 구간 × 과거 입금 여부)의 주별 평균 입금 ─── */
let BASE=null,BASEV=-1;
function baseLine(){
  if(BASEV===ST.ver)return BASE;
  const sum=[...Array(20)].map(()=>new Float64Array(NW)),cnt=[...Array(20)].map(()=>new Float64Array(NW));
  for(const d of DEBT){const first=d.acts.length?d.acts[0].sv:1e9;for(let k=0;k<NW;k++){if(W0+k*7+6>=first)break;sum[d.st][k]+=d.pw[k];cnt[d.st][k]++}}
  BASE=sum.map((s,i)=>s.map((v,k)=>cnt[i][k]?v/cnt[i][k]:0));BASEV=ST.ver;return BASE;
}
function evalAct(a){
  const d=a.d,k0=Math.floor((a.sv-W0)/7),K=Math.ceil(S.conN/7),B=baseLine()[d.st];
  let exp=0;for(let k=k0;k<k0+K&&k<NW;k++)exp+=B[k];
  let self=0,direct=0,naive=0;
  for(const p of d.pays){const at=attr(p).find(x=>x.a===a);if(at){if(at.kind==='직접')direct+=p.amt*at.share;else self+=p.amt*at.share}
    if(p.day>=a.sv&&p.day<a.sv+S.conN)naive+=p.amt}
  if(a.res!=='인용')exp=0;
  return{direct,self,exp,inc:direct+self-exp,net:direct+self-exp-a.cost,naive};
}
let EVC=null,EVK='';
function evalAll(){const k=ST.ver+'|'+ST.touch+'|'+S.conN;if(EVK===k)return EVC;EVC=new Map();for(const a of ACT)if(a.sv+S.conN<=TODAY)EVC.set(a,evalAct(a));EVK=k;return EVC}

const LA=()=>ST.gpf?ACT.filter(a=>a.d.pf===ST.gpf):ACT;
function typeSum(acts){
  const E=evalAll(),o={};for(const t of LTN)o[t]={t,n:0,cost:0,direct:0,self:0,exp:0,naive:0};
  for(const a of acts){const e=E.get(a);if(!e)continue;const x=o[a.t];x.n++;x.cost+=a.cost;x.direct+=e.direct;x.self+=e.self;x.exp+=e.exp;x.naive+=e.naive}
  for(const t of LTN){const x=o[t];x.inc=x.direct+x.self-x.exp;x.net=x.inc-x.cost;x.per=x.n?x.net/x.n:null;x.roi=x.cost?x.inc/x.cost:null}
  return o;
}

  const T={n:0,cost:0,direct:0,self:0,exp:0,naive:0};L.forEach(x=>{for(const k in T)T[k]+=x[k]});T.inc=T.direct+T.self-T.exp;T.net=T.inc-T.cost;
  const mx=Math.max(1,...L.map(x=>Math.max(x.naive/x.n,x.inc/x.n,x.cost/x.n)));
  const f=v=>Math.max(0,v)/mx*100;
  const bars=L.map(x=>`<div class="lb"><div><b>${x.t}</b><div class="sub">${x.n}건</div></div><div>

     <div class="lbr"><i style="width:${f(x.inc/x.n)}%;background:var(--text)"></i><span><b>${won(x.inc/x.n)}</b></span></div>
     <div class="lbr"><i style="width:${f(x.cost/x.n)}%;background:var(--bad);opacity:.6"></i><span>${won(x.cost/x.n)}</span></div></div></div>`).join('');
  return ph('법조치 성과','뒤에 들어온 돈 전부가 아니라, 비슷한 채무자보다 더 들어온 돈(증분)으로 법조치를 평가합니다',
    xlBtn,`<span class="sub">법조치가 겹치면</span><div class="seg">${[['last','최근 법조치에 붙이기'],['split','나눠 붙이기']].map(([k,n])=>`<button class="${ST.touch===k?'on':''}" onclick="ST.touch='${k}';render()">${n}</button>`).join('')}</div><span class="sub" style="margin-left:10px">송달 기간</span>${lperSeg()}`)+
  `<div class="kpis">
    <div class="card kpi"><span>결과 나온 법조치</span><b>${T.n.toLocaleString()}건</b><em>송달 뒤 ${S.conN}일 지난 것</em></div>
    <div class="card kpi"><span>① 직접 회수</span><b>${man(T.direct)}</b><em>추심금·배당금</em></div>
    <div class="card kpi"><span>② 연계 회수</span><b>${man(T.self)}</b><em>송달 뒤 ${S.conN}일 반응</em></div>
    <div class="card kpi"><span>비슷한 채무자 기대 (뺌)</span><b>−${man(T.exp)}</b><em>법조치 없었어도 들어왔을 돈</em></div>
    <div class="card kpi"><span>③ 증분 회수</span><b class="v-est">${man(T.inc)}</b><em>단순 합계 ${man(T.naive)}</em></div>
    <div class="card kpi"><span>비용 뺀 순증분</span><b class="v-est ${T.net<0?'down':''}">${man(T.net)}</b><em>비용 ${man(T.cost)} · 비용 1원당 ${(T.inc/Math.max(1,T.cost)).toFixed(1)}원</em></div></div>
  <div class="gside">${card('법조치 구분별','줄을 누르면 반응 곡선','',`<div class="cb flush"><div class="tw"><table class="xl"><thead><tr><th>법조치 구분</th><th class="n">건수</th><th class="n">건당 비용</th><th class="n">① 직접</th><th class="n">② 연계</th><th class="n">기대 (뺌)</th><th class="n">③ 증분</th><th class="n">순증분</th><th class="n">건당 순증분</th><th class="n">비용 1원당</th><th></th></tr></thead><tbody>
    ${L.map(x=>`<tr class="click" onclick="ST.ltype='${x.t}';go('lcurve')"><td class="nw"><b>${x.t}</b></td><td class="n">${x.n}</td><td class="n">${won(x.cost/x.n)}</td><td class="n">${man(x.direct)}</td><td class="n">${man(x.self)}</td><td class="n faint">−${man(x.exp)}</td>
      <td class="n v-est">${man(x.inc)}</td><td class="n ${x.net<0?'down':''}"><b>${man(x.net)}</b></td><td class="n ${x.per<0?'down':''}">${won(x.per)}</td><td class="n">${x.roi==null?'–':x.roi.toFixed(1)+'원'}</td><td>${x.n<S.minN?'<span class="tag warn">건수 적음</span>':''}</td></tr>`).join('')}
    <tr class="total"><td>전체</td><td class="n">${T.n}</td><td class="n">${won(T.cost/Math.max(1,T.n))}</td><td class="n">${man(T.direct)}</td><td class="n">${man(T.self)}</td><td class="n">−${man(T.exp)}</td><td class="n">${man(T.inc)}</td><td class="n">${man(T.net)}</td><td class="n">${won(T.net/Math.max(1,T.n))}</td><td class="n">${(T.inc/Math.max(1,T.cost)).toFixed(1)}원</td><td></td></tr></tbody></table></div></div>`)}
   <div class="stack">${card('건당 비교','회색 = 송달 뒤 들어온 돈 전부 · 검정 = 증분 · 빨강 = 비용','',`<div class="cb">${bars}</div>`)}
    <div class="note"><b>왜 「뒤에 들어온 돈 전부」가 아닌가</b><br>담당자는 갚을 만한 사람에게 법조치를 더 많이 합니다. 그래서 뒤 입금을 다 세면 효과가 부풀려집니다. 아직 법조치를 받지 않은 <b>같은 잔액 구간 · 같은 과거 입금 여부</b> 채무자가 같은 기간에 낸 돈을 빼서 증분을 셉니다.<br>
    <b>연계 기간</b> ${S.conN}일은 기준표에서 바꿉니다 — 「반응 곡선」에서 효과가 사라지는 때를 보고 정하세요. 약정 분납은 약정이 끝날 때까지 연계로 셉니다.</div></div></div>`;
};

/* ─── 반응 곡선 ─── */
V.lcurve=()=>{
  const t=ST.ltype||'예금 압류추심',B=baseLine(),PRE=8,POST=26,M=PRE+POST;
  const act=new Float64Array(M),exp=new Float64Array(M);let n=0;
  for(const a of LA()){if(a.t!==t||a.res!=='인용')continue;const k0=Math.floor((a.sv-W0)/7);if(k0-PRE<0||k0+POST>NW)continue;n++;
    for(let j=-PRE;j<POST;j++){act[j+PRE]+=a.d.pw[k0+j];exp[j+PRE]+=B[a.d.st][k0+j]}}
  const ca=[],ce=[];let s1=0,s2=0;for(let j=0;j<M;j++){s1+=act[j]/Math.max(1,n);s2+=exp[j]/Math.max(1,n);ca.push(s1);ce.push(s2)}
  const W=780,H=280,L=64,Bm=28,mx=Math.max(1,...ca,...ce)*1.08;
  const X=j=>L+j/(M-1)*(W-L-14),Y=v=>H-Bm-v/mx*(H-Bm-16);
  const pa=ca.map((v,j)=>(j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)).join(' '),pe=ce.map((v,j)=>(j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let area='M'+X(PRE)+' '+Y(ca[PRE]);for(let j=PRE;j<M;j++)area+=' L'+X(j)+' '+Y(ca[j]);for(let j=M-1;j>=PRE;j--)area+=' L'+X(j)+' '+Y(ce[j]);area+=' Z';
  const nw=Math.min(POST,Math.ceil(S.conN/7));
  const grid=[0,.5,1].map(q=>`<line x1="${L}" x2="${W-10}" y1="${Y(mx*q/1.08)}" y2="${Y(mx*q/1.08)}" stroke="var(--line)"/><text x="4" y="${Y(mx*q/1.08)+3}">${man(mx*q/1.08)}</text>`).join('');
  const ticks=[-8,-4,0,4,8,13,17,21,25].map(j=>`<text x="${X(j+PRE)-8}" y="${H-8}">${j===0?'송달':(j>0?'+':'')+j*7+'일'}</text>`).join('');
  const preGap=ce[PRE-1]?Math.abs(ca[PRE-1]-ce[PRE-1])/Math.max(1,ce[PRE-1]):0;
  const seg=(a,b)=>{let s=0,e=0;for(let j=PRE+a;j<PRE+b&&j<M;j++){s+=act[j];e+=exp[j]}return{s:s/Math.max(1,n),e:e/Math.max(1,n)}};
  const rows=[['0~30일',0,4],['31~60일',4,9],['61~90일',9,13],['91~180일',13,26]].map(([l,a,b])=>({l,...seg(a,b)}));
  return ph('반응 곡선','송달 뒤 1인당 누적 입금 — 법조치 받은 채무자 vs 아직 안 받은 비슷한 채무자',xlBtn)+
  `<div class="tabs">${LTN.map(x=>`<button class="${t===x?'on':''}" onclick="ST.ltype='${x}';render()">${x}</button>`).join('')}</div>
  <div class="gside"><div class="stack">${card(t+' · 1인당 누적 입금',`결과 나온 ${n}건 · 송달 앞 8주 ~ 뒤 26주`,`<span class="legend"><span><i style="background:var(--text)"></i>받은 채무자</span><span><i style="background:transparent;border-top:2px dashed var(--faint);height:0;border-radius:0"></i>비교 집단</span><span><i style="background:var(--acc-soft)"></i>차이 = 증분</span></span>`,
   `<div class="cb chart"><svg viewBox="0 0 ${W} ${H}">${grid}
     <rect x="${X(PRE)}" y="10" width="${X(PRE+nw)-X(PRE)}" height="${H-Bm-10}" fill="var(--panel2)"/><text x="${X(PRE)+4}" y="22" style="fill:var(--faint)">연계 기간 ${S.conN}일</text>
     <path d="${area}" fill="var(--acc-soft)"/><line x1="${X(PRE)}" x2="${X(PRE)}" y1="10" y2="${H-Bm}" stroke="var(--bad)" stroke-dasharray="3 3"/>
     <path d="${pe}" fill="none" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 4"/><path d="${pa}" fill="none" stroke="var(--text)" stroke-width="2.4"/>${ticks}</svg></div>`)}
   <div class="note ${preGap>.25?'warn':''}"><b>비교가 공정한지 확인</b> — 송달 <b>앞</b> 8주 동안 두 선의 차이 ${pct(preGap,0)}. ${preGap>.25?'차이가 커서 비교 집단이 잘 맞지 않습니다 — 증분은 참고만 하세요.':'비슷해서 송달 뒤 벌어진 차이를 법조치 효과로 볼 만합니다.'}</div></div>
   ${card('기간별 1인당 증분','','',`<div class="cb flush"><div class="tw"><table class="xl"><thead><tr><th>송달 뒤</th><th class="n">받은 채무자</th><th class="n">비교 집단</th><th class="n">증분</th></tr></thead><tbody>
     ${rows.map(r=>`<tr><td class="nw">${r.l}</td><td class="n">${won(r.s)}</td><td class="n faint">${won(r.e)}</td><td class="n ${r.s-r.e<0?'down':''}"><b>${won(r.s-r.e)}</b></td></tr>`).join('')}</tbody></table></div>
     <div class="cb sub">증분이 0 근처로 떨어지는 구간이 효과가 끝나는 때 → 기준표의 「연계로 셀 기간」을 그에 맞춥니다.</div></div>`)}</div>`;
};

/* ─── 다음 조치 ─── */
function seqStats(){
  const E=evalAll(),m={},P=['첫 법조치',...LTN];
  for(const p of P)for(const t of LTN){m[p+'|'+t]={n:0,net:0,inc:0,bal:0,cost:0};for(let b=0;b<5;b++)m[p+'|'+t+'|'+b]={n:0,net:0,inc:0,bal:0,cost:0}}
  for(const d of DEBT)d.acts.forEach((a,i)=>{const e=E.get(a);if(!e)return;const k0=(i?d.acts[i-1].t:'첫 법조치')+'|'+a.t,ks=k0+'|s'+d.st;if(!m[ks])m[ks]={n:0,net:0,inc:0,bal:0,cost:0};for(const x of [m[k0],m[k0+'|'+BANDS.indexOf(band(d.bal))],m[ks]]){x.n++;x.net+=e.net;x.inc+=e.inc;x.bal+=d.bal;x.cost+=a.cost}});
  for(const k in m){const x=m[k];x.avg=x.n?x.net/x.n:null;x.rate=x.bal?x.inc/x.bal:0;x.cpc=x.n?x.cost/x.n:0}return m;
}
function recs(){
  const m=seqStats(),out=[];
  for(const d of LD()){
    if(!d.acts.length)continue;const last=d.acts[d.acts.length-1];
    if(last.sv+S.conN>TODAY||d.pays.some(p=>p.day>TODAY-60))continue;
    const tl=d.title0||d.acts.some(a=>a.conf),el=tl?['예금 압류추심','증권 압류추심','재산명시']:['지급명령','소송'];if(tl&&d.hasJob)el.push('급여 압류추심');if(tl&&d.hasProp&&d.bal>=1e7)el.push('부동산 경매');
    if(d.bal<5e5)continue;let best=null;for(const t of el){const k=last.t+'|'+t,xs=m[k+'|s'+d.st],xb=m[k+'|'+BANDS.indexOf(band(d.bal))],x=xs&&xs.n>=S.minN?xs:xb&&xb.n>=S.minN?xb:m[k],lv=x===xs?'같은 묶음(과거 입금·집행권원·잔액)':x===xb?'같은 잔액 구간':'전체';if(!x||x.n<S.minN)continue;const est=x.rate*d.bal-x.cpc;if(!best||est>best.avg)best={t,n:x.n,rate:x.rate,cpc:x.cpc,avg:est,lv}}
    out.push({d,last,best,el});
  }
  return out.sort((a,b)=>(b.best?.avg??-1e12)-(a.best?.avg??-1e12));
}
V.lnext=()=>{
  const m=seqStats(),P=['첫 법조치',...LTN],R0s=recs(),ok=R0s.filter(r=>r.best&&r.best.avg>=S.minGain),NF=ST.nf,lim=ST.nlim||60,rs=R0s.filter(r=>(!NF.pos||r.best&&r.best.avg>=S.minGain)&&(!NF.t||r.best&&r.best.t===NF.t)&&(!NF.b||band(r.d.bal)===NF.b));
  return ph('다음 법조치','효과가 끝났는데 다음 법조치가 없는 채무자 — 같은 순서를 밟은 과거 사건의 건당 순증분으로 추천',xlBtn+`<button class="btn p" ${ST.nsel.size?'':'disabled'} onclick="sendNext()">고른 ${ST.nsel.size}명 엑셀로</button>`,
   `<span class="sub">걸러 보기</span><select onchange="ST.nf.t=this.value;ST.nlim=60;render()"><option value="">추천 조치 전체</option>${LTN.map(t=>`<option ${NF.t===t?'selected':''}>${t}</option>`).join('')}</select>
    <select onchange="ST.nf.b=this.value;ST.nlim=60;render()"><option value="">잔액 전체</option>${BANDS.map(b=>`<option ${NF.b===b?'selected':''}>${b}</option>`).join('')}</select>
    <label class="sub row" style="gap:6px"><input type="checkbox" ${NF.pos?'checked':''} onchange="ST.nf.pos=this.checked;ST.nlim=60;render()">기대 순증분 ${man(S.minGain)} 넘는 사람만</label><span class="sub" style="margin-left:auto">${rs.length.toLocaleString()}명</span>`)+
  `<div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card kpi"><span>효과 끝나고 멈춘 채무자</span><b>${R0s.length.toLocaleString()}명</b><em>마지막 송달 뒤 ${S.conN}일 지남 · 최근 60일 입금 없음</em></div>
   <div class="card kpi"><span>다음 조치로 순증분이 기대되는</span><b>${ok.length.toLocaleString()}명</b><em>근거 ${S.minN}건 넘는 순서만</em></div>
   <div class="card kpi"><span>기대 순증분 합</span><b class="v-est">${man(ok.reduce((s,r)=>s+r.best.avg,0))}</b><em>추천대로 모두 할 때</em></div></div>
  <div class="stack">
   ${card('추천 목록',`기대 순증분 큰 순서 · ${Math.min(lim,rs.length)} / ${rs.length.toLocaleString()}명`,'',`<div class="cb flush"><div class="tw" style="max-height:calc(100vh - 360px)"><table class="xl"><thead><tr><th style="width:34px"><input type="checkbox" title="보이는 사람 모두" onchange="nAll(this.checked)"></th><th>채무자키</th><th class="n">잔액</th><th>마지막 법조치</th><th class="n">지난 날</th><th>다음 추천</th><th class="n">이 사람 기대 순증분</th><th>이력</th><th></th></tr></thead><tbody>
    ${rs.slice(0,lim).map(r=>`<tr class="${ST.nsel.has(r.d.key)?'sel':''}"><td><input type="checkbox" ${ST.nsel.has(r.d.key)?'checked':''} onchange="nTog('${r.d.key}')"></td><td>${r.d.key}</td><td class="n">${man(r.d.bal)}</td><td class="nw">${r.last.t} <span class="sub">${ds(r.last.sv)}</span></td><td class="n">${TODAY-r.last.sv}일</td>
      <td class="nw">${r.best?`<b>${r.best.t}</b>`:'<span class="faint">근거 부족</span>'}</td><td class="n v-est ${r.best&&r.best.avg<0?'down':''}" ${r.best?`data-tip="${r.last.t} → ${r.best.t} · ${r.best.lv} 과거 ${r.best.n}건<br>잔액 대비 증분 ${pct(r.best.rate)} × 잔액 ${man(r.d.bal)}<br>− 비용 ${won(r.best.cpc)}"`:''}>${r.best?man(r.best.avg):'–'}</td>
      <td class="nw sub">${r.d.hasJob?'급여 추심 이력 ':''}${r.d.hasProp?'경매 이력 ':''}${!r.d.hasJob&&!r.d.hasProp?'–':''}</td><td><button class="btn sm" onclick="ST.tl='${r.d.key}';go('ltime')">타임라인</button></td></tr>`).join('')}${rs.length>lim?`<tr><td colspan="9" style="text-align:center;padding:12px"><button class="btn sm" onclick="ST.nlim=${lim}+60;render()">더 보기 (${(rs.length-lim).toLocaleString()}명 남음)</button></td></tr>`:''}</tbody></table></div></div>`)}
   ${card('앞 조치 → 다음 조치','건당 순증분 (원) · 칸 아래 = 건수','',`<div class="cb flush"><div class="tw"><table class="xl heat"><thead><tr><th>앞 \\ 다음</th>${LTN.map(t=>`<th style="text-align:center">${t}</th>`).join('')}</tr></thead><tbody>
    ${P.map(p=>`<tr><td class="nw"><b>${p}</b></td>${LTN.map(t=>{const x=m[p+'|'+t];if(x.n<S.hideN)return `<td class="hc hide">${x.n?'숨김':''}</td>`;
      const v=x.avg,pc=Math.round(Math.min(80,Math.abs(v)/300000*80));return `<td class="hc ${x.n<S.minN?'few':''}" style="background:color-mix(in srgb,${v<0?'var(--bad)':'var(--text)'} ${pc}%,var(--panel));color:${pc>45?'var(--bg)':'var(--text)'}">${man(v)}<small>${x.n}건</small></td>`}).join('')}</tr>`).join('')}
    </tbody></table></div><div class="cb sub">빨강 = 비용보다 증분이 적음 · 점선 = ${S.minN}건 미만(추천에 안 씀) · 오른쪽 추천은 이 표의 「잔액 대비 증분율」에 그 사람 잔액을 곱하고 비용을 빼서 사람마다 다르게 계산</div></div>`)}
  </div>
  <div class="note" style="margin-top:12px">급여압류는 직장 정보, 부동산경매는 재산 정보가 있고 잔액 1,000만 원 넘는 채무자에게만 추천합니다. 순서 성과도 「지켜본 결과」라서, 실제로 다르게 해 본 결과가 「결정과 결과」에 쌓이면 다시 맞춰 봅니다.</div>`;
};

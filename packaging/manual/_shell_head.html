<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} · 종합관리 v{{VERSION}}</title>
<style>
:root{--bg:#f5f5f3;--panel:#fff;--panel2:#f8f8f6;--line:#e6e6e2;--text:#141414;--sub:#5d5d64;--faint:#9a9aa0;--acc:#256abf;--acc-soft:#e9f0fb;--red:#e5484d;--red-soft:#fdeeee;--ok:#1b8a4e;--ok-soft:#e7f5ec;--warn:#b06f08;--warn-soft:#fcf3e2;--side:#0b0b0c;--sideW:284px;--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-size:15px;line-height:1.78;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--acc);text-decoration:none}
a:hover{text-decoration:underline}
/* 읽은 만큼 막대 */
.prog{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#5598e7,#256abf);z-index:60;transition:width .1s linear}
/* 왼쪽 차례 */
.side{position:fixed;top:0;left:0;bottom:0;width:var(--sideW);background:var(--side);color:#a7a7ae;overflow-y:auto;padding:18px 14px 40px;scrollbar-width:thin;scrollbar-color:#2a2a30 transparent;z-index:40;transition:transform .38s var(--ease)}
.brand{display:flex;align-items:flex-start;gap:10px;padding:2px 6px 0}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#5598e7,#1e3f78);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;flex-shrink:0}
.brand b{display:block;color:#fff;font-size:15.5px;letter-spacing:-.03em;line-height:1.3}
.brand small{display:block;color:#6c6c75;font-size:11.5px;margin-top:2px}
.side-x{margin-left:auto;background:none;border:0;color:#77777f;font-size:18px;cursor:pointer;padding:2px 6px;border-radius:7px;line-height:1}
.side-x:hover{background:#1c1c20;color:#fff}
.tocf{display:flex;gap:6px;margin:16px 4px 8px}
.tocf button{flex:1;background:#151518;border:1px solid #232328;color:#9a9aa2;border-radius:8px;font:inherit;font-size:11.5px;padding:4px 0;cursor:pointer}
.tocf button:hover{color:#fff;border-color:#3a3a42}
.toc .g{margin:2px 0}
.toc .g>a{display:flex;align-items:center;gap:9px;color:#b4b4bb;padding:7px 8px;border-radius:9px;font-size:13.5px;line-height:1.35;position:relative}
.toc a{text-decoration:none}
.toc .g>a:hover,.toc .sub a:hover{color:#fff;background:#18181b}
.toc .g>a.on{color:#fff;background:#202026}
.toc .g>a .ch{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:7px;background:#232328;color:#fff;font-size:11.5px;font-weight:700;flex-shrink:0;transition:background .25s}
.toc .g>a.on .ch{background:#256abf}
.toc .g>a .car{margin-left:auto;width:18px;height:18px;display:grid;place-items:center;color:#66666e;border-radius:5px;transition:transform .3s var(--ease)}
.toc .g>a .car:hover{background:#2a2a30;color:#fff}
.toc .g.open>a .car{transform:rotate(90deg)}
.toc .sub{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s var(--ease)}
.toc .g.open .sub{grid-template-rows:1fr}
.toc .sub>div{overflow:hidden;border-left:1px solid #26262c;margin-left:19px}
.toc .sub a{display:flex;align-items:center;color:#80808a;padding:4px 10px 4px 14px;font-size:12.5px;line-height:1.45;border-radius:0 8px 8px 0;margin-left:-1px;border-left:2px solid transparent}
.toc .sub a.on{color:#fff;border-left-color:#5598e7;background:#17171b}
.toc a .cnt{margin-left:auto;font-size:10.5px;background:#e5484d;color:#fff;border-radius:10px;padding:0 6px;display:none;line-height:16px}
.toc a.hit .cnt{display:inline-block}
.toc.searching a:not(.hit){opacity:.38}
.side-foot{margin:18px 8px 0;font-size:11.5px;color:#55555c;line-height:1.6}
.scrim{position:fixed;inset:0;background:rgba(8,10,14,.5);z-index:35;opacity:0;pointer-events:none;transition:opacity .3s}
/* 위 막대 */
.top{position:sticky;top:0;z-index:30;margin-left:var(--sideW);background:rgba(245,245,243,.86);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line);padding:10px 26px;display:flex;gap:10px;align-items:center;transition:margin-left .38s var(--ease)}
.tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:var(--text);transition:background .2s,transform .2s}
.tbtn:hover{background:var(--panel2)}
.tbtn:active{transform:scale(.94)}
.tbtn svg{width:18px;height:18px}
.search{flex:1;max-width:540px;display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:7px 12px;transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
.search input{flex:1;min-width:0;border:0;outline:0;font:inherit;font-size:14.5px;background:none}
.search kbd{font:600 11px/1 inherit;border:1px solid var(--line);border-radius:5px;padding:3px 6px;color:var(--sub)}
.sr{font-size:13px;color:var(--sub);white-space:nowrap}
.sbtn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;flex-shrink:0}
.sbtn:hover{background:var(--panel2)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex-shrink:1;min-width:0}
.chips::-webkit-scrollbar{display:none}
.chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:4px 11px;font:inherit;font-size:12.5px;color:var(--sub);cursor:pointer;white-space:nowrap;transition:all .2s}
.chips button:hover{border-color:var(--acc);color:var(--acc);transform:translateY(-1px)}
mark{background:#ffe58f;color:inherit;border-radius:3px;padding:0 1px}
mark.cur{background:#ff9f43;box-shadow:0 0 0 2px #ff9f43;animation:flash .6s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 10px rgba(255,159,67,0)}40%{box-shadow:0 0 0 6px rgba(255,159,67,.45)}100%{box-shadow:0 0 0 2px #ff9f43}}
/* 차례 닫힘 */
body.toc-off .side{transform:translateX(-100%)}
body.toc-off .top,body.toc-off main{margin-left:0}
/* 본문 */
main{margin-left:var(--sideW);padding:26px 30px 120px;transition:margin-left .38s var(--ease)}
.wrap{max-width:940px;margin:0 auto}
.cover{background:#0b0b0c;color:#fff;border-radius:24px;padding:46px 46px 38px;margin-bottom:26px;position:relative;overflow:hidden;isolation:isolate}
.cover .blob{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;z-index:-1;animation:float 14s ease-in-out infinite}
.cover .b1{width:340px;height:340px;background:#2b5fb0;right:-80px;top:-120px}
.cover .b2{width:260px;height:260px;background:#6a3fb5;left:-90px;bottom:-130px;animation-delay:-5s;opacity:.35}
.cover .b3{width:200px;height:200px;background:#1f8a7a;right:30%;bottom:-120px;animation-delay:-9s;opacity:.3}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-30px,20px) scale(1.08)}66%{transform:translate(20px,-14px) scale(.95)}}
.cover .k{font-size:13px;color:#9fb8e6;font-weight:600;letter-spacing:.02em}
.cover h1{font-size:36px;margin:6px 0 8px;letter-spacing:-.045em;line-height:1.22}
.cover p{margin:0;color:#c9cdd6;font-size:15px;max-width:640px}
.cover .meta{margin-top:20px;font-size:12.5px;color:#8e95a3}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:26px}
.flow a{display:block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.11);border-radius:15px;padding:14px 14px 12px;color:#fff;text-decoration:none;transition:transform .3s var(--ease),background .3s,border-color .3s}
.flow a:hover{background:rgba(255,255,255,.12);transform:translateY(-3px);border-color:rgba(255,255,255,.25)}
.flow b{display:block;font-size:14.5px}
.flow span{display:block;font-size:12.3px;color:#b6bcc8;line-height:1.5;margin-top:4px}
.flow i{font-style:normal;display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#5598e7;color:#fff;font-size:12px;font-weight:700;margin-bottom:6px}
section.ch{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:32px 38px 28px;margin-bottom:22px}
h2{font-size:24px;letter-spacing:-.035em;margin:0 0 4px;display:flex;align-items:center;gap:11px;line-height:1.3}
h2 .no{display:inline-grid;place-items:center;min-width:36px;height:36px;padding:0 8px;border-radius:11px;background:var(--text);color:#fff;font-size:16px}
.lead{color:var(--sub);margin:0 0 18px}
h3{font-size:18px;letter-spacing:-.025em;margin:32px 0 8px;padding-top:20px;border-top:1px dashed var(--line)}
h2+.lead+h3,h2+h3{border-top:0;padding-top:0;margin-top:18px}
h4{font-size:15px;margin:18px 0 6px}
p{margin:8px 0}
ul,ol{margin:8px 0;padding-left:22px}
li{margin:3px 0}
.n{display:inline-grid;place-items:center;width:21px;height:21px;border-radius:50%;background:var(--red);color:#fff;font-size:12px;font-weight:700;vertical-align:1px;margin-right:4px;line-height:1;flex-shrink:0}
ol.steps{list-style:none;padding:0}
ol.steps>li{display:grid;grid-template-columns:auto 1fr;gap:10px;margin:9px 0;align-items:start}
ol.steps>li>.n{margin-top:4px}
.btn{display:inline-block;border:1px solid #cfcfcb;background:#fff;border-radius:7px;padding:0 7px;font-size:13px;font-weight:600;line-height:1.7;white-space:nowrap}
.btn.p{background:#141414;color:#fff;border-color:#141414}
figure{margin:14px 0 20px}
figure .fr{position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--line);box-shadow:0 8px 28px rgba(0,0,0,.08);background:#fff;cursor:zoom-in;transition:transform .35s var(--ease),box-shadow .35s}
figure .fr:hover{transform:translateY(-2px);box-shadow:0 14px 36px rgba(0,0,0,.13)}
figure .fr:after{content:"⤢ 크게 보기";position:absolute;right:10px;bottom:10px;background:rgba(10,10,12,.75);color:#fff;font-size:12px;border-radius:8px;padding:3px 9px;opacity:0;transform:translateY(4px);transition:all .25s}
figure .fr:hover:after{opacity:1;transform:none}
figure img{width:100%;display:block}
figcaption{font-size:12.5px;color:var(--faint);margin-top:7px;text-align:center}
.call{border-radius:13px;padding:12px 16px;margin:12px 0;font-size:14px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.call b.t{font-size:12px;border-radius:6px;padding:1px 7px;margin-top:3px;white-space:nowrap}
.tip{background:var(--acc-soft)}.tip b.t{background:var(--acc);color:#fff}
.warn{background:var(--warn-soft)}.warn b.t{background:var(--warn);color:#fff}
.must{background:var(--red-soft)}.must b.t{background:var(--red);color:#fff}
.ok{background:var(--ok-soft)}.ok b.t{background:var(--ok);color:#fff}
.tw{overflow-x:auto;margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}
.tw table{margin:0}
th{text-align:left;background:var(--panel2);font-weight:600;color:var(--sub);font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.card{border:1px solid var(--line);border-radius:15px;padding:14px 16px;background:var(--panel2);transition:transform .3s var(--ease),box-shadow .3s}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.06)}
.card b{display:block;margin-bottom:4px}
a.card{color:inherit;text-decoration:none;display:block}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:20px;padding:1px 9px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.tag.r{background:var(--red-soft);color:var(--red);border-color:transparent}.tag.o{background:var(--warn-soft);color:var(--warn);border-color:transparent}.tag.g{background:var(--ok-soft);color:var(--ok);border-color:transparent}.tag.b{background:var(--acc-soft);color:var(--acc);border-color:transparent}
details{border:1px solid var(--line);border-radius:13px;padding:10px 14px;margin:8px 0;background:var(--panel2);transition:background .2s}
details summary{cursor:pointer;font-weight:600;list-style:none;display:flex;gap:8px}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"Q";color:var(--acc);font-weight:800}
details summary:after{content:"+";margin-left:auto;color:var(--faint);font-weight:400;transition:transform .3s}
details[open] summary:after{transform:rotate(45deg)}
details[open]{background:#fff}
details[open]>*:not(summary){animation:open .35s var(--ease)}
@keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
kbd{font:600 12px/1 inherit;border:1px solid #cfcfcb;border-bottom-width:2px;border-radius:5px;padding:2px 6px;background:#fff;white-space:nowrap}
.lb{position:fixed;inset:0;background:rgba(10,12,18,.88);display:flex;align-items:center;justify-content:center;z-index:100;cursor:zoom-out;padding:24px;opacity:0;pointer-events:none;transition:opacity .3s}
.lb.on{opacity:1;pointer-events:auto}
.lb img{max-width:100%;max-height:100%;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5);transform:scale(.94);transition:transform .35s var(--ease)}
.lb.on img{transform:none}
.totop{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;background:#141414;color:#fff;display:grid;place-items:center;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.22);text-decoration:none;opacity:0;transform:translateY(10px) scale(.9);transition:all .3s var(--ease);z-index:20}
.totop.on{opacity:1;transform:none}
.totop:hover{text-decoration:none;background:#256abf}
.empty-s{display:none;background:var(--warn-soft);border-radius:12px;padding:12px 16px;margin-bottom:16px}
/* 나타나기 */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.rv.in{opacity:1;transform:none}
figure.rv{transform:translateY(18px) scale(.985)}
figure.rv.in{transform:none}
.flow a{animation:up .7s var(--ease) both}
.flow a:nth-child(2){animation-delay:.07s}.flow a:nth-child(3){animation-delay:.14s}.flow a:nth-child(4){animation-delay:.21s}.flow a:nth-child(5){animation-delay:.28s}.flow a:nth-child(6){animation-delay:.35s}.flow a:nth-child(7){animation-delay:.42s}.flow a:nth-child(8){animation-delay:.49s}
.cover h1,.cover p,.cover .k{animation:up .8s var(--ease) both}.cover p{animation-delay:.08s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv.in .n{animation:pop .5s var(--ease) both}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
/* 좁은 화면 */
@media (max-width:1000px){
  .side{transform:translateX(-100%)}
  body.toc-on .side{transform:none;box-shadow:20px 0 50px rgba(0,0,0,.3)}
  body.toc-on .scrim{opacity:1;pointer-events:auto}
  .top,main,body.toc-off .top,body.toc-off main{margin-left:0}
  .flow{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr 1fr}
}
@media (max-width:680px){
  body{font-size:14.5px}
  main{padding:14px 12px 100px}
  .top{padding:8px 12px;flex-wrap:wrap}
  .search{order:2;flex-basis:100%;max-width:none}
  .chips{order:3;flex-basis:100%}
  .sr{margin-left:auto}
  .cover{padding:30px 22px 26px;border-radius:18px}
  .cover h1{font-size:27px}
  section.ch{padding:22px 18px 18px;border-radius:16px}
  h2{font-size:20px}
  h3{font-size:16.5px}
  .grid2,.grid3{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr}
  .tw table,table{font-size:13px}
  .totop{right:14px;bottom:14px}
}
/* 인쇄 · PDF */
@page{size:A4;margin:14mm 12mm 14mm}
.print-toc{display:none}
@media print{
  body{background:#fff;font-size:12.5px;line-height:1.65}
  .side,.top,.totop,.lb,.prog,.scrim,.cover .blob{display:none!important}
  main,body.toc-off main{margin:0;padding:0}
  .wrap{max-width:none}
  .rv{opacity:1!important;transform:none!important}
  *{animation:none!important;transition:none!important}
  .cover{border-radius:0;padding:40px 34px;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact;min-height:262mm;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(140deg,#0b0b0c 0%,#1e2a44 100%)}
  .flow a{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-toc{display:block;break-after:page}
  .print-toc h2{margin-bottom:12px}
  .print-toc ol{list-style:none;padding:0;columns:2;column-gap:28px}
  .print-toc li{display:flex;gap:8px;border-bottom:1px dotted #ccc;padding:3px 0;break-inside:avoid;font-size:12px}
  .print-toc li.l2{padding-left:22px;font-size:11px;color:#555}
  section.ch{border:0;border-radius:0;padding:0;margin:0;break-before:page}
  h3{break-after:avoid}
  figure{break-inside:avoid}
  figure .fr{box-shadow:none}
  figure .fr:after{display:none}
  .call,table,details,.card{break-inside:avoid}
  .card:hover,figure .fr:hover{transform:none}
  .call,.tag,.n,.btn.p,h2 .no{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  details{background:#fff}
  details summary:after{display:none}
  a{color:inherit}
}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<nav class="side" id="side" aria-label="차례">
  <div class="brand"><span class="logo">{{LOGO}}</span><div><b>{{TITLE}}</b><small>종합관리 v{{VERSION}} · {{DATE}}</small></div><button class="side-x" id="sideX" title="차례 닫기 ( [ )">✕</button></div>
  <div class="tocf"><button id="tAll">모두 펼치기</button><button id="tNone">모두 접기</button></div>
  <div class="toc" id="toc"></div>
  <div class="side-foot">찾기 <b>/</b> · 차례 열고 닫기 <b>[</b><br>그림을 누르면 크게 보여요</div>
</nav>
<div class="scrim" id="scrim"></div>
<div class="top" id="top">
  <button class="tbtn" id="tocBtn" title="차례 열기 · 닫기 ( [ )" aria-label="차례 열기 닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h10M4 18h16"/></svg></button>
  <label class="search"><span style="color:var(--faint)">⌕</span><input id="q" placeholder="찾을 말 (예: {{HINT}})" autocomplete="off"><kbd>/</kbd></label>
  <span class="sr" id="sr"></span>
  <button class="sbtn" id="prev" title="앞 결과 (Shift+Enter)">▲</button><button class="sbtn" id="next" title="다음 결과 (Enter)">▼</button>
  <div class="chips" id="chips">{{CHIPS}}</div>
</div>
<main><div class="wrap" id="content">
<div class="empty-s" id="nores">찾는 말이 없어요. 다른 말로 찾아보세요.</div>
